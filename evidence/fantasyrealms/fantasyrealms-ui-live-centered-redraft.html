<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>幻想国度 Live UI 重排稿</title>
  <style>
    :root {
      --wood-0: #140d09;
      --wood-1: #382315;
      --wood-2: #6a4120;
      --felt-0: #16362f;
      --felt-1: #285247;
      --felt-2: #1f433a;
      --gold: #d6ab55;
      --gold-soft: rgba(214, 171, 85, 0.28);
      --paper: #f2dfb5;
      --paper-ink: #2a1b12;
      --chip-top: #845835;
      --chip-bottom: #4f2f1a;
      --text: #fff1cd;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 214, 134, 0.18), transparent 26%),
        linear-gradient(145deg, var(--wood-0), var(--wood-1) 34%, var(--wood-2) 70%, #24160d);
      font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif;
      color: var(--text);
    }

    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 16%, rgba(255, 220, 153, 0.08), transparent 24%),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(0deg, rgba(0,0,0,0.16) 1px, transparent 1px);
      background-size: auto, 84px 84px, 84px 84px;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 56%, rgba(5, 3, 2, 0.52));
      pointer-events: none;
    }

    .mat {
      position: absolute;
      left: 16px;
      top: 16px;
      width: 1888px;
      height: 1048px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 24%, rgba(255, 232, 164, 0.10), transparent 28%),
        repeating-linear-gradient(36deg, rgba(255,255,255,0.018) 0 2px, transparent 2px 16px),
        linear-gradient(180deg, var(--felt-1), var(--felt-2));
      box-shadow:
        inset 0 0 0 1px rgba(255, 241, 205, 0.06),
        inset 0 0 130px rgba(6, 8, 7, 0.34);
    }

    .brand {
      position: absolute;
      left: 34px;
      top: 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 2;
    }

    .brand-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(180deg, #8b2424, #561717);
      border: 1px solid rgba(255, 215, 164, 0.32);
      box-shadow: 0 12px 18px rgba(0,0,0,0.22);
    }

    .brand-title {
      font-family: Georgia, "Times New Roman", "Microsoft YaHei UI", serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-shadow: 0 4px 10px rgba(0,0,0,0.24);
    }

    .top-axis {
      position: absolute;
      left: 50%;
      top: 24px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 3;
    }

    .chip {
      height: 46px;
      padding: 0 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--chip-top), var(--chip-bottom));
      border: 1px solid rgba(255, 223, 164, 0.38);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.14),
        0 12px 20px rgba(0,0,0,0.22);
      color: var(--text);
      font-size: 24px;
      font-weight: 800;
      white-space: nowrap;
    }

    .chip.small {
      height: 38px;
      padding: 0 16px;
      font-size: 18px;
      opacity: 0.94;
    }

    .chip.progress {
      min-width: 102px;
    }

    .score-band {
      position: absolute;
      right: 30px;
      top: 24px;
      width: 300px;
      height: 96px;
      padding: 14px 20px 12px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), transparent 30%),
        linear-gradient(180deg, #7b5330, #4b2c18);
      border: 1px solid rgba(255, 223, 164, 0.42);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.14),
        0 16px 26px rgba(0,0,0,0.28);
      z-index: 3;
    }

    .score-band::before {
      content: "";
      position: absolute;
      left: 28px;
      top: 10px;
      width: 94px;
      height: 14px;
      border-radius: 6px;
      background: rgba(230, 199, 126, 0.42);
      transform: rotate(3deg);
    }

    .score-kicker {
      position: relative;
      z-index: 1;
      color: rgba(43, 25, 13, 0.82);
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .score-main {
      margin-top: 14px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .score-main strong {
      color: #fff2cf;
      font-family: Georgia, "Times New Roman", "Microsoft YaHei UI", serif;
      font-size: 40px;
      line-height: 1;
      font-weight: 900;
      text-shadow: 0 4px 12px rgba(0,0,0,0.24);
    }

    .score-main span {
      font-size: 17px;
      font-weight: 800;
      color: rgba(255, 242, 207, 0.88);
      white-space: nowrap;
    }

    .river {
      position: absolute;
      left: 340px;
      top: 176px;
      width: 1240px;
      height: 520px;
      z-index: 2;
    }

    .river-card {
      position: absolute;
      width: 190px;
      height: 264px;
      border-radius: 16px;
      border: 3px solid rgba(255, 234, 194, 0.96);
      background-size: cover;
      background-position: center;
      box-shadow: 0 26px 34px rgba(0,0,0,0.40);
    }

    .r1 { left: 25px; top: 18px; background-image: url("card-crops/discard-great-flood.png"); }
    .r2 { left: 285px; top: 18px; background-image: url("card-crops/discard-judicator.png"); }
    .r3 { left: 545px; top: 18px; background-image: url("card-crops/discard-leprechaun.png"); }
    .r4 { left: 805px; top: 18px; background-image: url("card-crops/hand-hydra.png"); }
    .r5 { left: 1045px; top: 18px; background-image: url("card-crops/hand-unicorn.png"); }
    .r6 { left: 155px; top: 222px; background-image: url("card-crops/hand-forest.png"); }
    .r7 { left: 415px; top: 222px; background-image: url("card-crops/hand-forge.png"); }
    .r8 { left: 675px; top: 222px; background-image: url("card-crops/hand-king.png"); }
    .r9 { left: 935px; top: 222px; background-image: url("card-crops/hand-gem-of-order.png"); }

    .river-note {
      position: absolute;
      left: 50%;
      top: -24px;
      transform: translateX(-50%);
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(22, 34, 28, 0.84);
      border: 1px solid rgba(255, 223, 164, 0.16);
      color: rgba(255, 241, 205, 0.82);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .hand-band {
      position: absolute;
      left: 141px;
      bottom: 26px;
      width: 1638px;
      height: 325px;
      display: flex;
      gap: 0;
      z-index: 4;
    }

    .hand-card {
      flex: 0 0 234px;
      height: 325px;
      border-radius: 16px;
      border: 3px solid rgba(255, 234, 194, 0.96);
      background-size: cover;
      background-position: center;
      box-shadow: 0 26px 34px rgba(0,0,0,0.42);
    }

    .h1 { background-image: url("card-crops/hand-forest.png"); }
    .h2 { background-image: url("card-crops/hand-forge.png"); }
    .h3 { background-image: url("card-crops/hand-gem-of-order.png"); }
    .h4 { background-image: url("card-crops/hand-hydra.png"); }
    .h5 { background-image: url("card-crops/hand-king.png"); }
    .h6 { background-image: url("card-crops/hand-knights.png"); }
    .h7 { background-image: url("card-crops/hand-unicorn.png"); }

    .impl-note {
      position: absolute;
      left: 34px;
      bottom: 28px;
      max-width: 420px;
      padding: 16px 18px;
      border-radius: 16px;
      background: rgba(18, 26, 22, 0.74);
      border: 1px solid rgba(255, 223, 164, 0.12);
      color: rgba(255, 241, 205, 0.82);
      font-size: 14px;
      line-height: 1.55;
      z-index: 2;
    }

    .impl-note b {
      display: block;
      margin-bottom: 6px;
      color: #fff2cf;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="幻想国度 live 进行时重排稿">
    <section class="mat" aria-label="牌桌主体"></section>

    <div class="brand">
      <div class="brand-badge" aria-hidden="true"></div>
      <div class="brand-title">幻想国度</div>
    </div>

    <div class="top-axis" aria-label="进行时顶部轴线">
      <div class="chip small">牌库 31</div>
      <div class="chip">玩家4</div>
      <div class="chip progress">9/10</div>
      <div class="chip small">摸1</div>
    </div>

    <aside class="score-band" aria-label="当前总分与排名">
      <div class="score-kicker">当前总分 / 第 3 名</div>
      <div class="score-main">
        <strong>99</strong>
        <span>第 3 名</span>
      </div>
    </aside>

    <section class="river" aria-label="中央公开弃牌河">
      <div class="river-note">中央公共区，不再承担顶部计数</div>
      <div class="river-card r1"></div>
      <div class="river-card r2"></div>
      <div class="river-card r3"></div>
      <div class="river-card r4"></div>
      <div class="river-card r5"></div>
      <div class="river-card r6"></div>
      <div class="river-card r7"></div>
      <div class="river-card r8"></div>
      <div class="river-card r9"></div>
    </section>

    <section class="hand-band" aria-label="底部连续大手牌">
      <div class="hand-card h1"></div>
      <div class="hand-card h2"></div>
      <div class="hand-card h3"></div>
      <div class="hand-card h4"></div>
      <div class="hand-card h5"></div>
      <div class="hand-card h6"></div>
      <div class="hand-card h7"></div>
    </section>

    <aside class="impl-note">
      <b>实现约束</b>
      顶部信息必须围绕页面中轴布局；`9/10` 属于顶部状态区，不再悬在中央牌河；右上只保留单块摘要带；底部 7 张手牌零间隔连续铺开，优先保证牌面尺寸。
    </aside>
  </main>
</body>
</html>
