<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">幻想国度 16:9 UI 布局参考图</title>
  <desc id="desc">以七张手牌、焦点牌计分、抽牌来源和弃牌进度为主次的游戏界面布局参考。</desc>
  <defs>
    <linearGradient id="table" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#432917"/>
      <stop offset="0.42" stop-color="#6f4324"/>
      <stop offset="1" stop-color="#1f2f2d"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="42%" r="70%">
      <stop offset="0" stop-color="#f5d79b" stop-opacity="0.32"/>
      <stop offset="0.48" stop-color="#aa6b38" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0e1716" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="1" stop-color="#e9d0a0"/>
    </linearGradient>
    <linearGradient id="darkPanel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#52321f"/>
      <stop offset="1" stop-color="#241915"/>
    </linearGradient>
    <linearGradient id="greenPanel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#284b3f"/>
      <stop offset="1" stop-color="#172522"/>
    </linearGradient>
    <pattern id="felt" width="72" height="72" patternUnits="userSpaceOnUse">
      <rect width="72" height="72" fill="none"/>
      <path d="M0 18H72M0 54H72M18 0V72M54 0V72" stroke="#fff3cf" stroke-opacity="0.035" stroke-width="1"/>
      <path d="M0 72L72 0" stroke="#0b1211" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="focusClip">
      <rect x="582" y="144" width="230" height="322" rx="28"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0e0906" flood-opacity="0.38"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#160d08" flood-opacity="0.24"/>
    </filter>
    <style>
      .label { font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif; fill: #fff4da; }
      .ink { font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif; fill: #2b1b10; }
      .muted { fill: #8c7352; }
      .tiny { font-size: 22px; }
      .small { font-size: 26px; }
      .mid { font-size: 34px; font-weight: 700; }
      .big { font-size: 46px; font-weight: 800; }
      .chip { fill: rgba(255, 244, 218, 0.12); stroke: rgba(255, 221, 158, 0.26); stroke-width: 1.5; }
      .goldStroke { stroke: #e0b35d; stroke-width: 2; }
      .thinGold { stroke: rgba(224, 179, 93, 0.48); stroke-width: 1.5; }
      .cardTitle { font-size: 24px; font-weight: 800; }
      .cardSub { font-size: 18px; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#table)"/>
  <rect width="1920" height="1080" fill="url(#felt)" opacity="0.88"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <g opacity="0.28">
    <circle cx="1540" cy="198" r="238" fill="none" stroke="#e7b96b" stroke-width="2"/>
    <circle cx="1540" cy="198" r="184" fill="none" stroke="#e7b96b" stroke-width="1"/>
    <path d="M1392 74Q1540 152 1688 74M1392 322Q1540 244 1688 322" fill="none" stroke="#e7b96b" stroke-width="1"/>
  </g>

  <g transform="translate(64 42)">
    <rect x="0" y="0" width="1792" height="76" rx="28" fill="#120e0d" opacity="0.24"/>
    <text x="30" y="50" class="label big">幻想国度</text>
    <g transform="translate(288 17)">
      <rect class="chip" width="172" height="42" rx="21"/>
      <text x="22" y="29" class="label tiny">当前玩家 你</text>
    </g>
    <g transform="translate(480 17)">
      <rect class="chip" width="160" height="42" rx="21"/>
      <text x="22" y="29" class="label tiny">阶段 抽牌</text>
    </g>
    <g transform="translate(660 17)">
      <rect class="chip" width="166" height="42" rx="21"/>
      <text x="22" y="29" class="label tiny">牌库 31</text>
    </g>
    <g transform="translate(846 17)">
      <rect class="chip" width="190" height="42" rx="21"/>
      <text x="22" y="29" class="label tiny">弃牌 7 / 10</text>
    </g>
    <g transform="translate(1496 17)">
      <rect class="chip" width="128" height="42" rx="21"/>
      <text x="24" y="29" class="label tiny">帮助</text>
    </g>
    <g transform="translate(1640 17)">
      <rect class="chip" width="128" height="42" rx="21"/>
      <text x="24" y="29" class="label tiny">日志</text>
    </g>
  </g>

  <g transform="translate(64 148)" filter="url(#shadow)">
    <rect x="0" y="0" width="418" height="860" rx="34" fill="url(#greenPanel)" stroke="#dca85c" stroke-opacity="0.32" stroke-width="2"/>
    <text x="34" y="58" class="label mid">抽牌来源</text>
    <text x="34" y="94" class="label tiny" opacity="0.72">当前回合第一步，只选一个来源</text>

    <g transform="translate(34 130)">
      <rect x="0" y="0" width="350" height="238" rx="28" fill="#fff4d7" opacity="0.10" stroke="#f4c979" stroke-opacity="0.42"/>
      <rect x="32" y="38" width="116" height="162" rx="16" fill="#1a1515" stroke="#dfb56c" stroke-width="2"/>
      <image href="../../public/assets/i18n/zh-CN/fantasyrealms/cards/backs/fantasyrealms-base-card-back.png" x="32" y="38" width="116" height="162" preserveAspectRatio="xMidYMid slice" opacity="0.88"/>
      <text x="178" y="82" class="label mid">牌库</text>
      <text x="178" y="120" class="label tiny" opacity="0.82">暗抽 1 张</text>
      <rect x="178" y="150" width="124" height="42" rx="21" fill="#e0b35d"/>
      <text x="206" y="179" class="ink tiny" font-weight="700">选择</text>
    </g>

    <g transform="translate(34 398)">
      <rect x="0" y="0" width="350" height="296" rx="28" fill="#fff4d7" opacity="0.10" stroke="#f4c979" stroke-opacity="0.42"/>
      <text x="26" y="42" class="label mid">弃牌区明牌</text>
      <text x="26" y="78" class="label tiny" opacity="0.78">可拿回公开牌</text>
      <g transform="translate(26 102)">
        <rect x="0" y="0" width="82" height="116" rx="12" fill="url(#paper)" class="goldStroke"/>
        <text x="13" y="40" class="ink cardSub">洪流</text>
        <text x="16" y="78" class="ink mid">18</text>
        <rect x="98" y="14" width="82" height="116" rx="12" fill="#f6e2b3" stroke="#d3994b" stroke-width="2"/>
        <text x="113" y="54" class="ink cardSub">军队</text>
        <text x="116" y="92" class="ink mid">15</text>
        <rect x="196" y="28" width="82" height="116" rx="12" fill="#ebd09f" stroke="#d3994b" stroke-width="2"/>
        <text x="211" y="68" class="ink cardSub">法师</text>
        <text x="214" y="106" class="ink mid">7</text>
      </g>
      <rect x="26" y="238" width="148" height="42" rx="21" fill="#e0b35d"/>
      <text x="56" y="267" class="ink tiny" font-weight="700">拿取明牌</text>
    </g>

    <g transform="translate(34 730)">
      <rect x="0" y="0" width="350" height="92" rx="26" fill="#120d0b" opacity="0.34"/>
      <text x="26" y="38" class="label small">抽完后必须弃 1 张</text>
      <text x="26" y="70" class="label tiny" opacity="0.72">手牌始终维持 7 张</text>
    </g>
  </g>

  <g transform="translate(514 148)" filter="url(#shadow)">
    <rect x="0" y="0" width="850" height="860" rx="36" fill="#fbefd4" stroke="#dca85c" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="24" y="22" width="802" height="250" rx="30" fill="#3f2618" opacity="0.12"/>
    <text x="42" y="66" class="ink mid">当前组合</text>
    <text x="42" y="104" class="ink tiny muted">优先看组合得分、封印风险和可弃置收益</text>
    <g transform="translate(596 42)">
      <rect x="0" y="0" width="190" height="66" rx="26" fill="#284b3f"/>
      <text x="28" y="42" class="label mid">148 分</text>
    </g>

    <g clip-path="url(#focusClip)">
      <rect x="582" y="144" width="230" height="322" rx="28" fill="#1b1110"/>
      <image href="../../public/assets/i18n/zh-CN/fantasyrealms/cards/atlases/fantasyrealms-base-cards-atlas.png" x="492" y="112" width="468" height="462" preserveAspectRatio="xMidYMid slice" opacity="0.82"/>
      <rect x="582" y="144" width="230" height="322" fill="url(#darkPanel)" opacity="0.38"/>
    </g>
    <rect x="582" y="144" width="230" height="322" rx="28" fill="none" stroke="#e0b35d" stroke-width="4"/>
    <rect x="600" y="378" width="194" height="70" rx="18" fill="#1b1110" opacity="0.72"/>
    <text x="620" y="408" class="label small" font-weight="700">焦点牌</text>
    <text x="620" y="436" class="label cardSub" opacity="0.82">联动 / 惩罚</text>

    <g transform="translate(42 134)">
      <rect x="0" y="0" width="500" height="116" rx="26" fill="#fff8e8" stroke="#d6a158" stroke-opacity="0.44"/>
      <text x="28" y="42" class="ink small" font-weight="700">得分拆解</text>
      <text x="28" y="78" class="ink tiny">基础 83  +  联动 78  -  惩罚 13</text>
      <rect x="328" y="30" width="138" height="48" rx="24" fill="#6d2925"/>
      <text x="352" y="62" class="label tiny" font-weight="700">封印风险</text>
    </g>

    <g transform="translate(42 338)">
      <text x="0" y="0" class="ink mid">手牌 7 / 7</text>
      <text x="168" y="0" class="ink tiny muted">当前主要决策区</text>
    </g>

    <g transform="translate(42 368)">
      <g transform="translate(0 0) rotate(-4 52 142)">
        <rect width="104" height="166" rx="18" fill="#f5ddb0" stroke="#c8863f" stroke-width="2"/>
        <text x="18" y="44" class="ink cardSub">领袖</text><text x="22" y="92" class="ink mid">8</text>
      </g>
      <g transform="translate(92 0) rotate(-2 52 142)">
        <rect width="104" height="166" rx="18" fill="#e9c78b" stroke="#c8863f" stroke-width="2"/>
        <text x="18" y="44" class="ink cardSub">军队</text><text x="22" y="92" class="ink mid">20</text>
      </g>
      <g transform="translate(184 -8)">
        <rect width="118" height="188" rx="20" fill="#fff3ce" stroke="#e0b35d" stroke-width="4"/>
        <text x="19" y="50" class="ink cardSub">神器</text><text x="24" y="104" class="ink mid">5</text>
        <rect x="18" y="132" width="82" height="28" rx="14" fill="#284b3f"/>
        <text x="32" y="152" class="label cardSub">当前</text>
      </g>
      <g transform="translate(294 0) rotate(2 52 142)">
        <rect width="104" height="166" rx="18" fill="#e4b46f" stroke="#c8863f" stroke-width="2"/>
        <text x="18" y="44" class="ink cardSub">烈焰</text><text x="22" y="92" class="ink mid">11</text>
      </g>
      <g transform="translate(386 0) rotate(4 52 142)">
        <rect width="104" height="166" rx="18" fill="#dcb87c" stroke="#c8863f" stroke-width="2"/>
        <text x="18" y="44" class="ink cardSub">土地</text><text x="22" y="92" class="ink mid">9</text>
      </g>
      <g transform="translate(478 0) rotate(6 52 142)">
        <rect width="104" height="166" rx="18" fill="#c7d5ce" stroke="#c8863f" stroke-width="2"/>
        <text x="18" y="44" class="ink cardSub">天象</text><text x="22" y="92" class="ink mid">8</text>
      </g>
      <g transform="translate(570 0) rotate(8 52 142)">
        <rect width="104" height="166" rx="18" fill="#d8d1b5" stroke="#c8863f" stroke-width="2"/>
        <text x="18" y="44" class="ink cardSub">巨兽</text><text x="22" y="92" class="ink mid">12</text>
      </g>
    </g>

    <g transform="translate(42 606)">
      <rect x="0" y="0" width="638" height="184" rx="30" fill="#fff8e8" stroke="#d6a158" stroke-opacity="0.42"/>
      <text x="28" y="48" class="ink mid">弃置候选</text>
      <text x="28" y="84" class="ink tiny muted">弃 1 张后进入弃牌区，可能被后续玩家拿走</text>
      <rect x="28" y="112" width="142" height="48" rx="24" fill="#6d2925"/>
      <text x="58" y="144" class="label tiny" font-weight="700">弃置所选</text>
      <rect x="188" y="112" width="142" height="48" rx="24" fill="#284b3f"/>
      <text x="218" y="144" class="label tiny" font-weight="700">保留组合</text>
      <rect x="360" y="112" width="224" height="48" rx="24" fill="#ead29e"/>
      <text x="390" y="144" class="ink tiny" font-weight="700">展开完整计分</text>
    </g>

    <g transform="translate(718 686)">
      <rect x="0" y="0" width="318" height="104" rx="28" fill="#284b3f"/>
      <text x="28" y="42" class="label small" font-weight="700">结束回合</text>
      <text x="28" y="76" class="label tiny" opacity="0.72">弃牌后可用</text>
    </g>
  </g>

  <g transform="translate(1396 148)" filter="url(#shadow)">
    <rect x="0" y="0" width="460" height="860" rx="34" fill="url(#darkPanel)" stroke="#dca85c" stroke-opacity="0.34" stroke-width="2"/>
    <text x="34" y="58" class="label mid">弃牌区</text>
    <text x="34" y="94" class="label tiny" opacity="0.72">公开信息，也是终局倒计时</text>

    <g transform="translate(34 126)">
      <rect x="0" y="0" width="392" height="96" rx="28" fill="#fff4d7" opacity="0.10"/>
      <text x="26" y="40" class="label small" font-weight="700">终局进度</text>
      <text x="284" y="42" class="label small" font-weight="700">7 / 10</text>
      <rect x="26" y="62" width="340" height="12" rx="6" fill="#140f0d" opacity="0.64"/>
      <rect x="26" y="62" width="238" height="12" rx="6" fill="#e0b35d"/>
    </g>

    <g transform="translate(34 260)">
      <text x="0" y="0" class="label small" font-weight="700">最近公开牌</text>
      <g transform="translate(0 26)">
        <rect x="0" y="0" width="108" height="152" rx="16" fill="#f0d7a5" stroke="#dfb56c" stroke-width="2"/>
        <text x="20" y="46" class="ink cardSub">洪流</text><text x="24" y="94" class="ink mid">18</text>
        <rect x="132" y="0" width="108" height="152" rx="16" fill="#f7e5be" stroke="#dfb56c" stroke-width="2"/>
        <text x="152" y="46" class="ink cardSub">军队</text><text x="156" y="94" class="ink mid">15</text>
        <rect x="264" y="0" width="108" height="152" rx="16" fill="#e8cc91" stroke="#dfb56c" stroke-width="2"/>
        <text x="284" y="46" class="ink cardSub">法师</text><text x="288" y="94" class="ink mid">7</text>
      </g>
    </g>

    <g transform="translate(34 486)">
      <text x="0" y="0" class="label small" font-weight="700">公开堆叠</text>
      <g transform="translate(0 28)">
        <rect x="0" y="0" width="392" height="170" rx="28" fill="#fff4d7" opacity="0.10"/>
        <g transform="translate(26 28)">
          <rect x="0" y="0" width="54" height="76" rx="10" fill="#d8c08c" opacity="0.95"/>
          <rect x="46" y="10" width="54" height="76" rx="10" fill="#ecd49e" opacity="0.95"/>
          <rect x="92" y="20" width="54" height="76" rx="10" fill="#f6e2b4" opacity="0.95"/>
          <rect x="138" y="30" width="54" height="76" rx="10" fill="#e2bd7a" opacity="0.95"/>
          <text x="222" y="42" class="label tiny">其余 4 张</text>
          <text x="222" y="78" class="label tiny" opacity="0.72">点击展开</text>
        </g>
      </g>
    </g>

    <g transform="translate(34 720)">
      <rect x="0" y="0" width="392" height="104" rx="28" fill="#fff4d7" opacity="0.10"/>
      <text x="26" y="42" class="label small" font-weight="700">座位顺序</text>
      <text x="26" y="76" class="label tiny" opacity="0.72">你 · 小王 · 小李 · 小张</text>
    </g>
  </g>
</svg>
