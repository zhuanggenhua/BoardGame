<!doctype html>
<html lang="zh-CN">
<head>

  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    body { margin: 0; background: #111827; color: #e5e7eb; }

    h1 { margin: 0 0 4px; font-size: 20px; }

    figure { margin: 0; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 12px; }
    img { display: block; width: 100%; height: auto; border-radius: 8px; background: #030712; }
    figcaption { padding-top: 10px; }
    strong { display: block; font-size: 15px; }
    span { display: block; margin-top: 4px; color: #9ca3af; font-size: 13px; line-height: 1.5; }
    .empty { padding: 24px; color: #fca5a5; }
  </style>
</head>
<body>
  <header>
    <h1>山屋惊魂 · 规范直接证据闭环 · 20260922</h1>
    <p>这个文件固定在截图目录内；刷新页面会读取该目录当前文件。</p>
  </header>
  <main id="gallery"></main>
  <script>
    const items = [{"relativePath":"01-事件牌翻出投掷入口.jpg","displayTitle":"01 · 事件牌翻出投掷入口","description":"","kind":"image"},{"relativePath":"02-投掷后保留骰子描述.jpg","displayTitle":"02 · 投掷后保留骰子描述","description":"","kind":"image"},{"relativePath":"03-骰盘停稳总点数可见.jpg","displayTitle":"03 · 骰盘停稳总点数可见","description":"","kind":"image"},{"relativePath":"04-结算结果可见.jpg","displayTitle":"04 · 结算结果可见","description":"","kind":"image"},{"relativePath":"05-关闭后回牌桌.jpg","displayTitle":"05 · 关闭后回牌桌","description":"","kind":"image"},{"relativePath":"06-物品-首位确认后仍等待.jpg","displayTitle":"06 · 物品 · 首位确认后仍等待","description":"","kind":"image"},{"relativePath":"07-物品-第二位确认后仍未关闭.jpg","displayTitle":"07 · 物品 · 第二位确认后仍未关闭","description":"","kind":"image"},{"relativePath":"08-物品-最后确认飞行动画中.jpg","displayTitle":"08 · 物品 · 最后确认飞行动画中","description":"","kind":"image"},{"relativePath":"09-物品-动画结束最终落位.jpg","displayTitle":"09 · 物品 · 动画结束最终落位","description":"","kind":"image"},{"relativePath":"10-预兆-首位确认后仍等待.jpg","displayTitle":"10 · 预兆 · 首位确认后仍等待","description":"","kind":"image"},{"relativePath":"11-预兆-第二位确认后仍未关闭.jpg","displayTitle":"11 · 预兆 · 第二位确认后仍未关闭","description":"","kind":"image"},{"relativePath":"12-预兆-最后确认飞行动画中.jpg","displayTitle":"12 · 预兆 · 最后确认飞行动画中","description":"","kind":"image"},{"relativePath":"13-预兆-动画结束最终落位.jpg","displayTitle":"13 · 预兆 · 动画结束最终落位","description":"","kind":"image"}];
    const gallery = document.querySelector("#gallery");
    const cacheBust = Date.now();
    if (items.length === 0) {
      gallery.innerHTML = '<div class="empty">当前目录还没有截图。</div>';
    } else {
      for (const item of items) {
        const figure = document.createElement("figure");
        const image = document.createElement("img");
        image.alt = item.displayTitle;
        image.src = "./" + encodeURIComponent(item.relativePath) + "?updated=" + cacheBust;
        const caption = document.createElement("figcaption");
        const label = document.createElement("strong");
        label.textContent = item.displayTitle;
        caption.append(label);
        if (item.description) {
          const description = document.createElement("span");
          description.textContent = item.description;
          caption.append(description);
        }
        figure.append(image, caption);
        gallery.append(figure);
      }
    }
  </script>
</body>
</html>
