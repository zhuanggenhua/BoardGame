  <script>
    const items = [{"relativePath":"01-PC-辽北前线与当前目标.png","displayTitle":"PC · 辽北前线与当前目标","description":"教程开局，辽北军队、边境局面和本次目标同时可见。","kind":"image"},{"relativePath":"02-PC-轮盘免费前进一步.png","displayTitle":"PC · 轮盘免费前进一步","description":"准备移动轮盘时，合法走法与本次引导落点同时可见。","kind":"image"},{"relativePath":"03-PC-到达开垦军屯与先征召.png","displayTitle":"PC · 到达开垦军屯与先征召","description":"轮盘到达开垦、军屯格后，说明两项可分别执行，先用本回合手牌行动扩充辽北。","kind":"image"},{"relativePath":"04-PC-征召弃牌支付.png","displayTitle":"PC · 征召弃牌支付","description":"选择征召后，手牌费用选择与确认入口出现。","kind":"image"},{"relativePath":"05-PC-共享放大镜检视征召手牌.png","displayTitle":"PC · 共享放大镜检视征召手牌","description":"检视支付手牌后，共享放大镜完整显示真实牌面。","kind":"image"},{"relativePath":"06-PC-全部合法征兵地区与辽北引导.png","displayTitle":"PC · 全部合法征兵地区与辽北引导","description":"确认征召费用后，地图显示全部合法建军地区及本次引导。","kind":"image"},{"relativePath":"07-PC-辽北完整地区与建军选项.png","displayTitle":"PC · 辽北完整地区与建军选项","description":"选择辽北后，完整地区与可建立的部队选项同时可见。","kind":"image"},{"relativePath":"08-PC-征召后执行同格军屯.png","displayTitle":"PC · 征召后执行同格军屯","description":"征召完成回到原落点菜单，接着用军屯补牌并增加驻军。","kind":"image"},{"relativePath":"09-PC-军屯后继续同格开垦.png","displayTitle":"PC · 军屯后继续同格开垦","description":"军屯完成后仍停留同一格，可继续开垦；没有跳到另一个回合。","kind":"image"},{"relativePath":"10-PC-开垦地区选择.png","displayTitle":"PC · 开垦地区选择","description":"辽东人口与兵力相同而不能收税，选择开垦使其满足接下来年中的税赋条件。","kind":"image"},{"relativePath":"11-PC-年中税赋与漕运.png","displayTitle":"PC · 年中税赋与漕运","description":"两位对手已行动并触发年中；刚开垦的辽东符合税赋条件，补牌后进入大明手牌上限处理。","kind":"image"},{"relativePath":"12-PC-年中补牌后的手牌上限处理.png","displayTitle":"PC · 年中补牌后的手牌上限处理","description":"年中补牌后，手牌上限处理与弃牌确认入口出现。","kind":"image"},{"relativePath":"13-PC-军备升级卡牌.png","displayTitle":"PC · 军备升级卡牌","description":"选择研发后，军备卡与待支付手牌在同一画面可见。","kind":"image"},{"relativePath":"14-PC-先选出兵来源.png","displayTitle":"PC · 先选出兵来源","description":"支付调度费用后，地图先显示可出兵的来源地区。","kind":"image"},{"relativePath":"15-PC-地图兵牌选择出兵.png","displayTitle":"PC · 地图兵牌选择出兵","description":"选定辽北后，可投入行动的实际兵牌全部可见。","kind":"image"},{"relativePath":"16-PC-已选部队与确认出兵.png","displayTitle": ivePath":"32-PC-外交后继续同格雇佣.png","displayTitle":"PC · 外交后继续同格雇佣","description":"外交结果已确认，同一落点仍可雇佣；菜单与当前手牌费用规则对应。","kind":"image"},{"relativePath":"33-PC-雇佣部队目标.png","displayTitle":"PC · 雇佣部队目标","description":"雇佣加强辽东驻防，同时提示兵力将超过人口，后续新年须弃牌或移除部队承担耗损。","kind":"image"},{"relativePath":"34-PC-新年朝贡与结算顺序.png","displayTitle":"PC · 新年朝贡与结算顺序","description":"蒙古已触发新年，大明控制的朝鲜区域已带来朝贡牌，当前进入防线维护。","kind":"image"},{"relativePath":"35-PC-山海关维护选择.png","displayTitle":"PC · 山海关维护选择","description":"进入防线维护时，山海关维护与放弃选项同时可见。","kind":"image"},{"relativePath":"36-PC-叶赫部队维持费用.png","displayTitle":"PC · 叶赫部队维持费用","description":"刚占领的叶赫部属于非汉人区域，正规军不能用当地人口补给；当前选择手牌维持前线。","kind":"image"},{"relativePath":"37-PC-三张费用牌分别选中.png","displayTitle":"PC · 三张费用牌分别选中","description":"逐张选择维持费用后，各张手牌保留独立选中反馈。","kind":"image"},{"relativePath":"38-PC-手牌末端与翻看入口.png","displayTitle":"PC · 手牌末端与翻看入口","description":"使用手牌两侧箭头翻看到末端，其余手牌与向左返回入口可见，原支付选择保持。","kind":"image"},{"relativePath":"39-PC-平壤雇佣军耗损选择.png","displayTitle":"PC · 平壤雇佣军耗损选择","description":"轮到平壤耗损时，地图显示可选择的实际部队。","kind":"image"},{"relativePath":"40-PC-选中平壤耗损部队.png","displayTitle":"PC · 选中平壤耗损部队","description":"点击平壤部队后，兵牌选择反馈与确认入口出现。","kind":"image"},{"relativePath":"41-PC-领取纪年卡的费用.png","displayTitle":"PC · 领取纪年卡的费用","description":"完成年度耗损后，纪年争夺与真实手牌支付入口出现。","kind":"image"},{"relativePath":"42-PC-新年顺位与纪年.png","displayTitle":"PC · 新年顺位与纪年","description":"领取本年纪年后，下一张成为当前卡，确定新顺位与人物；蒙古已选完，现在由大明选择。","kind":"image"},{"relativePath":"43-PC-新年度人物选择.png","displayTitle":"PC · 新年度人物选择","description":"进入年度人物判定后，人物选项与实际卡牌同时可见。","kind":"image"},{"relativePath":"44-PC-共享放大镜检视人物.png","displayTitle":"PC · 共享放大镜检视人物","description":"检视年度人物后，共享放大镜完整显示人物牌面。","kind":"image"},{"relativePath":"45-PC-新顺位首回合后回到大明.png","displayTitle":"PC · 新顺位首回合后回到大明","description":"后金人物与蒙古新年首回合已经完成，大明从推进后的轮盘位置继续。","kind":"image"},{"relativePath":"46-PC-次年炮兵训练选择.png","displayTitle":"PC · 次年炮兵训练选择","description":"次年支付训练费用后，实际可训练部队与推荐候选可见。","kind":"image"},{"relativePath":"47-PC-剩余基础训练与前线步兵.png","displayTitle":"PC · 剩余基础训练与前线步兵","description":"原参战炮兵已升级，剩余三次基础训练不再付牌，继续加强原征召的步兵。","kind":"image"},{"relativePath":"48-PC-四次基础训练完成与保留手牌.png","displayTitle":"PC · 四次基础训练完成与保留手牌","description":"实际四次基础训练已经用完；结束行动保留最后一张牌，额外训练并非当前必付费用。","kind":"image"},{"relativePath":"49-PC-完整年度教程结束并继续对局.png","displayTitle":"PC · 完整年度教程结束并继续对局","description":"完成次年训练后，教程提示结束，当前对局保留。","kind":"image"}];
    const gallery = document.querySelector("#gallery");
    const cacheBust = Date.now();
    if (items.length === 0) {
      gallery.innerHTML = '<div class="empty">当前目录还没有截图。</div>';
    } else {
      for (const item of items) {
        const figure = document.createElement("figure");
        const image = document.createElement("img");
        image.alt = item.displayTitle;
        image.src = "./" + encodeURIComponent(item.relativePath) + "?updated=" + cacheBust;
        const caption = document.createElement("figcaption");
        const label = document.createElement("strong");
        label.textContent = item.displayTitle;
        caption.append(label);
        if (item.description) {
          const description = document.createElement("span");
          description.textContent = item.description;
          caption.append(description);
        }
        figure.append(image, caption);
        gallery.append(figure);
      }
    }
  </script>
</body>
</html>
