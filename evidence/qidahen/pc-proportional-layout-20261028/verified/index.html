<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="5" />
  <title>七大恨桌面与手机等比布局验收</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    body { margin: 0; background: #111827; color: #e5e7eb; }
    header { position: sticky; top: 0; z-index: 1; padding: 16px 20px; background: #1f2937; border-bottom: 1px solid #374151; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p { margin: 0; color: #9ca3af; font-size: 13px; }
    main { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); padding: 20px; }
    figure { margin: 0; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 12px; }
    img { display: block; width: 100%; height: auto; border-radius: 8px; background: #030712; }
    figcaption { padding-top: 10px; }
    strong { display: block; font-size: 15px; }
    span { display: block; margin-top: 4px; color: #9ca3af; font-size: 13px; line-height: 1.5; }
    .empty { padding: 24px; color: #fca5a5; }
  </style>
</head>
<body>
  <header>
    <h1>七大恨桌面与手机等比布局验收</h1>
    <p>这个文件固定在截图目录内；刷新页面会读取该目录当前文件。</p>
  </header>
  <main id="gallery"></main>
  <script>
    const items = [{"relativePath":"01-桌面常态.png","displayTitle":"01 · 桌面常态","description":"桌面常态保留正式轮盘、三席公开读数、两张纪年、朝鲜牌堆、三张手牌、抽弃牌、地图控件及右侧势力动作，类别和查看入口贴所属卡牌，未见对象遗失、同层意外交叠或素材破图。","kind":"image"},{"relativePath":"02-手机常态.png","displayTitle":"02 · 手机常态","description":"手机常态沿用桌面相同对象、方位及相对构图，侧边底色与文字整体缩小符合明确等比合同，未因适配另排、隐藏规则对象或造成卡牌与查看入口错位。","kind":"image"},{"relativePath":"03-桌面支付.png","displayTitle":"03 · 桌面支付","description":"桌面支付中选中事件牌抬升并保留已选标记，支付栏与真实牌顶分离且确认取消完整，没有压住类别、卡名或查看入口，其余手牌和固定读数仍在。","kind":"image"},{"relativePath":"04-手机支付.png","displayTitle":"04 · 手机支付","description":"手机支付与桌面支付保持同一结构和比例，选中牌、其余两牌、支付进度及确认取消均有对应，支付栏没有压住抬升牌顶且类别和查看入口未漂移。","kind":"image"},{"relativePath":"05-手机八张支付压力态.png","displayTitle":"05 · 手机八张支付压力态","description":"手机八牌压力态从完整首牌开始，末端局部露牌表达横向延续，各牌类别和查看圆面准确跟随牌本体，支付栏未压牌顶且没有两层起点错开或首牌被裁去。","kind":"image"},{"relativePath":"06-宽屏桌面常态.png","displayTitle":"06 · 宽屏桌面常态","description":"宽屏桌面常态保持标准桌面相同对象与结构，字体、动作间距、手牌及查看入口随统一尺度变化，未见再次独立改字号、异常拉散、人口数字两两相压或正式素材失真。","kind":"image"},{"relativePath":"07-小屏手机常态.png","displayTitle":"07 · 小屏手机常态","description":"小屏手机常态仍保留桌面同构的轮盘、三席、纪年、牌堆、三牌及动作与地图控件，没有因窄屏删对象或产生入口错位，整体缩小按明确等比合同保留。","kind":"image"},{"relativePath":"08-桌面八张支付压力态.png","displayTitle":"08 · 桌面八张支付压力态","description":"桌面八牌压力态与手机同为完整首牌起始和末端局部露牌的横向结构，类别和查看入口逐牌对应，支付栏完整位于牌排上方，未见首牌裁切、卡牌彼此压叠或残留空槽。","kind":"image"},{"relativePath":"09-手机地图浏览前.png","displayTitle":"09 · 手机地图浏览前","description":"手机地图浏览前保持同一固定界面构图和三牌状态，可见人口块彼此分开，部分地图对象位于固定手牌之后属于可浏览场景的跨层覆盖，图内尚未显示地区说明。","kind":"image"},{"relativePath":"10-手机地图平移检视后.png","displayTitle":"10 · 手机地图平移检视后","description":"手机地图平移检视后原先靠近手牌的地区及人口已移到无遮挡位置，地区旁出现原有说明卡并可辨地区标题、属性分行与底部操作，固定轮盘、三席、纪年和手牌仍保持原位。","kind":"image"}];
    const gallery = document.querySelector("#gallery");
    const cacheBust = Date.now();
    if (items.length === 0) {
      gallery.innerHTML = '<div class="empty">当前目录还没有截图。</div>';
    } else {
      for (const item of items) {
        const figure = document.createElement("figure");
        const image = document.createElement("img");
        image.alt = item.displayTitle;
        image.src = "./" + encodeURIComponent(item.relativePath) + "?updated=" + cacheBust;
        const caption = document.createElement("figcaption");
        const label = document.createElement("strong");
        label.textContent = item.displayTitle;
        caption.append(label);
        if (item.description) {
          const description = document.createElement("span");
          description.textContent = item.description;
          caption.append(description);
        }
        figure.append(image, caption);
        gallery.append(figure);
      }
    }
  </script>
</body>
</html>
