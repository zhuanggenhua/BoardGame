<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="5" />
  <title>七大恨连续入门：辽北军屯、突袭叶赫与同局继续</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    body { margin: 0; background: #111827; color: #e5e7eb; }
    header { position: sticky; top: 0; z-index: 1; padding: 16px 20px; background: #1f2937; border-bottom: 1px solid #374151; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p { margin: 0; color: #9ca3af; font-size: 13px; }
    main { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); padding: 20px; }
    figure { margin: 0; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 12px; }
    img { display: block; width: 100%; height: auto; border-radius: 8px; background: #030712; }
    figcaption { padding-top: 10px; }
    strong { display: block; font-size: 15px; }
    span { display: block; margin-top: 4px; color: #9ca3af; font-size: 13px; line-height: 1.5; }
    .empty { padding: 24px; color: #fca5a5; }
  </style>
</head>
<body>
  <header>
    <h1>七大恨连续入门：辽北军屯、突袭叶赫与同局继续</h1>
    <p>这个文件固定在截图目录内；刷新页面会读取该目录当前文件。</p>
  </header>
  <main id="gallery"></main>
  <script>
    const items = [{"relativePath":"00-辽北军屯地区选择.png","displayTitle":"00 · 辽北军屯地区选择","description":"辽北军屯地区选择","kind":"image"},{"relativePath":"01-轮盘前进两格与军屯落点.png","displayTitle":"01 · 轮盘前进两格与军屯落点","description":"轮盘前进两格与军屯落点","kind":"image"},{"relativePath":"02-指定后金抽牌.png","displayTitle":"02 · 指定后金抽牌","description":"指定后金抽牌","kind":"image"},{"relativePath":"03-辽北军屯结果.png","displayTitle":"03 · 辽北军屯结果","description":"辽北军屯结果","kind":"image"},{"relativePath":"03a-手牌悬停完整抬起.png","displayTitle":"03a · 手牌悬停完整抬起","description":"手牌悬停完整抬起","kind":"image"},{"relativePath":"03b-共享放大镜检视手牌.png","displayTitle":"03b · 共享放大镜检视手牌","description":"共享放大镜检视手牌","kind":"image"},{"relativePath":"04-叶赫部真实地图目标.png","displayTitle":"04 · 叶赫部真实地图目标","description":"叶赫部真实地图目标","kind":"image"},{"relativePath":"05-银两支付与鸳鸯阵手牌.png","displayTitle":"05 · 银两支付与鸳鸯阵手牌","description":"银两支付与鸳鸯阵手牌","kind":"image"},{"relativePath":"05a-鸳鸯阵选中与确认出牌.png","displayTitle":"05a · 鸳鸯阵选中与确认出牌","description":"鸳鸯阵选中与确认出牌","kind":"image"},{"relativePath":"05b-出兵选择前与真实兵牌引导.png","displayTitle":"05b · 出兵选择前与真实兵牌引导","description":"出兵选择前与真实兵牌引导","kind":"image"},{"relativePath":"06-野战选择实际出兵部队.png","displayTitle":"06 · 野战选择实际出兵部队","description":"野战选择实际出兵部队","kind":"image"},{"relativePath":"07-战后幸存部队与占领选择.png","displayTitle":"07 · 战后幸存部队与占领选择","description":"战后幸存部队与占领选择","kind":"image"},{"relativePath":"08-叶赫部占领结果.png","displayTitle":"08 · 叶赫部占领结果","description":"叶赫部占领结果","kind":"image"},{"relativePath":"09-教程退出后同局继续.png","displayTitle":"09 · 教程退出后同局继续","description":"教程退出后同局继续","kind":"image"},{"relativePath":"移动-00-轮盘两格与指定对手.png","displayTitle":"移动 · 00 · 轮盘两格与指定对手","description":"移动，00，轮盘军屯与指定对手","kind":"image"},{"relativePath":"移动-01-叶赫部地图目标避开支付托盘.png","displayTitle":"移动 · 01 · 叶赫部地图目标避开支付托盘","description":"移动，01，叶赫部地图目标避开支付托盘","kind":"image"},{"relativePath":"移动-02-突袭支付与手牌.png","displayTitle":"移动 · 02 · 突袭支付与手牌","description":"移动，02，突袭支付与手牌","kind":"image"},{"relativePath":"移动-03-长按银两检视卡面.png","displayTitle":"移动 · 03 · 长按银两检视卡面","description":"移动，03，长按银两检视卡面","kind":"image"},{"relativePath":"移动-04-检视返回后轻点银两选择支付.png","displayTitle":"移动 · 04 · 检视返回后轻点银两选择支付","description":"移动，04，检视返回后轻点银两选择支付","kind":"image"}];
    const gallery = document.querySelector("#gallery");
    const cacheBust = Date.now();
    if (items.length === 0) {
      gallery.innerHTML = '<div class="empty">当前目录还没有截图。</div>';
    } else {
      for (const item of items) {
        const figure = document.createElement("figure");
        const image = document.createElement("img");
        image.alt = item.displayTitle;
        image.src = "./" + encodeURIComponent(item.relativePath) + "?updated=" + cacheBust;
        const caption = document.createElement("figcaption");
        const label = document.createElement("strong");
        label.textContent = item.displayTitle;
        caption.append(label);
        if (item.description) {
          const description = document.createElement("span");
          description.textContent = item.description;
          caption.append(description);
        }
        figure.append(image, caption);
        gallery.append(figure);
      }
    }
  </script>
</body>
</html>
