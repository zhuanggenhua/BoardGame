import java.util.Properties
import groovy.json.JsonSlurper

apply plugin: 'com.android.application'
def archiveBaseNameOverride = (
    project.findProperty('androidArchiveBaseName')
        ?: System.getenv('ANDROID_ARCHIVE_BASE_NAME')
        ?: 'easyboardgame'
).toString().trim()
archivesBaseName = archiveBaseNameOverride ?: 'easyboardgame'

def packageJsonFile = rootProject.file('../package.json')
def packageJson = packageJsonFile.exists() ? new JsonSlurper().parse(packageJsonFile) : [:]
def packageVersionName = (packageJson.version ?: '1.0.0').toString()
def explicitAndroidVersionCode = packageJson.androidVersionCode instanceof Number
    ? packageJson.androidVersionCode.intValue()
    : null
def parseAndroidVersionCode = { versionName ->
    def segments = versionName
        .split('\\.')
        .collect { segment ->
            def numeric = (segment =~ /\d+/)
            numeric.find() ? Integer.parseInt(numeric.group(0)) : 0
        }

    while (segments.size() < 3) {
        segments << 0
    }

    return (segments[0] * 10000) + (segments[1] * 100) + segments[2]
}
// 保持原生版本与 package.json 单一真实来源一致，避免 OTA targetNativeVersion 对不齐。
def packageVersionCode = explicitAndroidVersionCode ?: parseAndroidVersionCode(packageVersionName)

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseSigning = false
def requiresReleaseSigning = gradle.startParameter.taskNames.any { taskName -> taskName.toLowerCase().contains('release') }
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasReleaseSigning = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { key ->
        keystoreProperties[key]
    }
}

android {
    namespace = "top.easyboardgame.app"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    defaultConfig {
        applicationId "top.easyboardgame.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode packageVersionCode
        versionName packageVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

android.applicationVariants.configureEach { variant ->
    variant.outputs.configureEach { output ->
        outputFileName = "${archivesBaseName}-${variant.buildType.name}.apk"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

if (requiresReleaseSigning && !hasReleaseSigning) {
    throw new GradleException('Missing Android release signing. Run npm run mobile:android:prepare-release or set ANDROID_KEYSTORE_PATH / ANDROID_KEYSTORE_BASE64.')
}

def capacitorConfigFile = file('src/main/assets/capacitor.config.json')
def capacitorConfig = capacitorConfigFile.exists() ? new JsonSlurper().parse(capacitorConfigFile) : [:]
def androidServerConfig = capacitorConfig.server instanceof Map ? capacitorConfig.server : [:]
def androidWebviewMode = androidServerConfig.url ? 'remote' : 'embedded'
def distAndroidBuildMetaFile = rootProject.file('../dist/android-build-meta.json')
def syncedAndroidBuildMetaFile = file('src/main/assets/public/android-build-meta.json')
def capacitorPluginsJsonFile = file('src/main/assets/capacitor.plugins.json')
def capacitorSettingsGradleFile = rootProject.file('capacitor.settings.gradle')
def capacitorBuildGradleFile = file('capacitor.build.gradle')
def requiresSyncedWebAssets = androidWebviewMode == 'embedded' && gradle.startParameter.taskNames.any { taskName ->
    def lowerTaskName = taskName.toLowerCase()
    lowerTaskName.contains('assemble') || lowerTaskName.contains('bundle') || lowerTaskName.contains('install')
}
if (requiresSyncedWebAssets) {
    if (!distAndroidBuildMetaFile.exists()) {
        throw new GradleException('Missing dist/android-build-meta.json. Run npm run mobile:android:sync before building Android.')
    }
    if (!syncedAndroidBuildMetaFile.exists()) {
        throw new GradleException('Missing synced Android web assets. Run npm run mobile:android:sync before building Android.')
    }
    if (distAndroidBuildMetaFile.getText('UTF-8') != syncedAndroidBuildMetaFile.getText('UTF-8')) {
        throw new GradleException('Android web assets are out of sync with dist. Run npm run mobile:android:sync or npm run mobile:android:build:release.')
    }
}
if (!capacitorPluginsJsonFile.exists()) {
    throw new GradleException('Missing android/app/src/main/assets/capacitor.plugins.json. Run npm run mobile:android:sync before building Android.')
}
if (!capacitorSettingsGradleFile.exists() || !capacitorBuildGradleFile.exists()) {
    throw new GradleException('Missing generated Capacitor Gradle files. Run npm run mobile:android:sync before building Android.')
}
def capacitorPlugins = new JsonSlurper().parse(capacitorPluginsJsonFile)
if (!(capacitorPlugins instanceof List)) {
    throw new GradleException('android/app/src/main/assets/capacitor.plugins.json has invalid shape. Run npm run mobile:android:sync before building Android.')
}
def capacitorSettingsText = capacitorSettingsGradleFile.getText('UTF-8')
def capacitorBuildText = capacitorBuildGradleFile.getText('UTF-8')
def missingCapacitorPluginWiring = []
capacitorPlugins.each { plugin ->
    def pkg = plugin instanceof Map ? (plugin.pkg ?: '').toString().trim() : ''
    if (!pkg) {
        return
    }
    def projectName = pkg.replaceFirst('^@', '').replace('/', '-')
    def includeLine = "include ':${projectName}'"
    def implementationLine = "implementation project(':${projectName}')"
    if (!capacitorSettingsText.contains(includeLine) || !capacitorBuildText.contains(implementationLine)) {
        missingCapacitorPluginWiring << pkg
    }
}
if (!missingCapacitorPluginWiring.isEmpty()) {
    throw new GradleException("Capacitor plugin wiring is stale for: ${missingCapacitorPluginWiring.join(', ')}. Run npm run mobile:android:sync before building Android.")
}
