# 生产环境 Docker Compose 配置（镜像部署模式）
# 使用预构建镜像，无需本地 build
# 文档：docs/deploy.md

services:
  mongodb:
    image: mongo:6
    container_name: boardgame-mongodb
    restart: unless-stopped
    # 生产环境不暴露端口到宿主机，仅容器内部通信
    # 如需本地调试可临时取消注释
    # ports:
    #   - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: boardgame
    # 限制 WiredTiger 缓存为 256MB（MongoDB 6 最小要求 0.25GB）
    # 限制容器内存为 512MB，防止 MongoDB 挤占其他服务
    command: mongod --wiredTigerCacheSizeGB 0.25
    mem_limit: 512m
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: boardgame-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  game-server:
    image: ghcr.io/zhuanggenhua/boardgame-game:latest
    container_name: boardgame-game-server
    restart: unless-stopped
    # game-server 承载在线对局状态，CPU 高水位只能限速；内存超限会被 OOM 后按 restart 策略拉起。
    # 重启是止血兜底，业务侧仍必须用 watchdog 恢复上限避免重复空转。
    cpus: "1.50"
    mem_limit: 1024m
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      GAME_SERVER_PORT: 18000
      SOCKET_IO_ALLOW_POLLING: "true"
      MONGO_URI: mongodb://mongodb:27017/boardgame
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FEEDBACK_API_URL: http://web/feedback
      INTERNAL_FEEDBACK_TOKEN: ${INTERNAL_FEEDBACK_TOKEN}
      # 生产对局默认不采集训练数据，避免长局持续写盘和大样本序列化拖慢 PVE/PVP。
      ENABLE_TRAINING_DATA_CAPTURE: "false"
      TRAINING_DATA_DIR: /data/training-data
      TRAINING_DATA_MIN_COMPLETED_MATCH_DURATION_MS: ${TRAINING_DATA_MIN_COMPLETED_MATCH_DURATION_MS:-600000}
      TRAINING_DATA_PENDING_RETENTION_HOURS: ${TRAINING_DATA_PENDING_RETENTION_HOURS:-24}
    volumes:
      - training_data:/data/training-data
    # 仅容器内部通信，不暴露到宿主机
    # 如需本地调试可临时取消注释
    # ports:
    #   - "18000:18000"

  web:
    image: ghcr.io/zhuanggenhua/boardgame-web:latest
    container_name: boardgame-web
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      game-server:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_SERVER_PORT: 80
      SOCKET_IO_ALLOW_POLLING: "true"
      GAME_SERVER_PROXY_TARGET: http://game-server:18000
      MONGO_URI: mongodb://mongodb:27017/boardgame
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_FEEDBACK_TOKEN: ${INTERNAL_FEEDBACK_TOKEN}
      # 部署/回滚执行器运行在宿主机 systemd 中，不属于本 compose 项目。
      # web 容器只负责鉴权和发起请求，避免回滚时重启自身导致执行状态丢失。
      BG_DEPLOY_RUNNER_URL: ${BG_DEPLOY_RUNNER_URL:-http://host.docker.internal:18761}
      BG_DEPLOY_RUNNER_TOKEN: ${BG_DEPLOY_RUNNER_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  training_data:
    driver: local
