<details><summary>为什么是 29 个？</summary><p>没有出现目标配对时，“圆形苹果 7 个”和“五角星桃子 6 个”不能同时取到，最多保留较多的 7 个；“五角星苹果 7 个”和“圆形桃子 9 个”也不能同时取到，最多保留较多的 9 个。西瓜糖可以全部取出，共 8＋4＝12 个。因此最多能取出 7＋9＋12＝28 个而仍不满足要求；再取一个，即 <strong>29 个</strong>，就一定出现目标配对。</p><p>这里按题目的通常含义，求任意摸出的糖果集合都能保证满足要求的最少数量。</p></details>
