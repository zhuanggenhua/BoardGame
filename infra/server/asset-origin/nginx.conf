worker_processes 1;
pid runtime/nginx.pid;
error_log stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map_hash_bucket_size 128;

    include /home/admin/storage/assets/origin/origin-secret.conf;

    map $http_x_asset_client_ip $asset_client_key {
        default $http_x_asset_client_ip;
        "" $binary_remote_addr;
    }

    map $uri $asset_cache_control {
        default "public, max-age=31536000, immutable";
        ~*\.json$ "public, max-age=300, stale-while-revalidate=60";
    }

    map $asset_origin_authorized $asset_response_cache_control {
        default "no-store";
        1 $asset_cache_control;
    }

    limit_conn_zone $server_name zone=asset_global:1m;
    limit_conn_zone $asset_client_key zone=asset_per_client:10m;

    access_log off;
    sendfile on;
    etag on;
    tcp_nopush on;
    open_file_cache max=4096 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    server {
        listen 127.0.0.1:19090;
        server_name _;
        root /home/admin/storage/assets/current;

        location = /__asset_health {
            access_log off;
            add_header Cache-Control "no-store" always;
            return 204;
        }

        location / {
            if ($asset_origin_authorized = 0) {
                return 403;
            }

            limit_except GET HEAD {
                deny all;
            }

            limit_conn_status 429;
            limit_conn asset_global 32;
            limit_conn asset_per_client 4;
            limit_rate_after 1m;
            limit_rate 2m;

            try_files $uri =404;

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, ETag, Last-Modified, X-Asset-Source" always;
            add_header Cache-Control $asset_response_cache_control always;
            add_header CDN-Cache-Control "no-store" always;
            add_header X-Asset-Source "server" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
