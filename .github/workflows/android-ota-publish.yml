name: Android OTA Publish

on:
  workflow_dispatch:
    inputs:
      channel:
        description: '目标 OTA channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - gray
          - edge
      git_ref:
        description: '要发布的 git ref（分支、tag 或 commit SHA，留空默认当前触发 ref）'
        required: false
        type: string
      expected_base_version:
        description: '本次发布的目标基础版本（必填，例如 0.5.33）；必须与 package.json.version 完全一致'
        required: true
        type: string
      dry_run:
        description: '仅预演，不上传'
        required: true
        default: false
        type: boolean
      skip_latest:
        description: '上传 bundle，但不覆盖 latest.json'
        required: true
        default: false
        type: boolean
      force_update:
        description: '是否强制 OTA（默认关闭；如需下载完成后立即切换请显式开启）'
        required: true
        default: false
        type: boolean
      force_update_title:
        description: '强更页标题（可选）'
        required: false
        type: string
      force_update_message:
        description: '强更页正文（可选）'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', inputs.channel) || github.run_id }}
  cancel-in-progress: true

jobs:
  publish-ota:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && !inputs.dry_run && 'android-ota-production' || 'android-ota-nonprod' }}

    steps:
      - name: Resolve publish parameters
        id: params
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            channel="${{ inputs.channel }}"
            target_ref="${{ inputs.git_ref }}"
            dry_run="${{ inputs.dry_run }}"
            skip_latest="${{ inputs.skip_latest }}"
            force_update="${{ inputs.force_update }}"
            force_update_title="${{ inputs.force_update_title }}"
            force_update_message="${{ inputs.force_update_message }}"
            expected_base_version="${{ inputs.expected_base_version }}"
            source_mode="manual"
          else
            echo "::error::自动 OTA 已禁用隐式版本；请使用 workflow_dispatch 并显式提供 expected_base_version。"
            exit 1
          fi

          if [[ -z "${target_ref}" ]]; then
            target_ref="${GITHUB_SHA}"
          fi

          {
            echo "channel=${channel}"
            echo "target_ref=${target_ref}"
            echo "expected_base_version=${expected_base_version}"
            echo "dry_run=${dry_run}"
            echo "skip_latest=${skip_latest}"
            echo "force_update=${force_update}"
            echo "force_update_title=${force_update_title}"
            echo "force_update_message=${force_update_message}"
            echo "source_mode=${source_mode}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate OTA prerequisites
        id: prereq
        shell: bash
        env:
          ANDROID_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || vars.ANDROID_VITE_BACKEND_URL || secrets.VITE_BACKEND_URL || secrets.ANDROID_VITE_BACKEND_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          DRY_RUN: ${{ steps.params.outputs.dry_run }}
        run: |
          missing=()

          if [[ -z "${ANDROID_BACKEND_URL}" ]]; then
            missing+=("VITE_BACKEND_URL(or ANDROID_VITE_BACKEND_URL)")
          fi

          if [[ "${DRY_RUN}" != "true" ]]; then
            [[ -n "${R2_ACCOUNT_ID}" ]] || missing+=("R2_ACCOUNT_ID")
            [[ -n "${R2_ACCESS_KEY_ID}" ]] || missing+=("R2_ACCESS_KEY_ID")
            [[ -n "${R2_SECRET_ACCESS_KEY}" ]] || missing+=("R2_SECRET_ACCESS_KEY")
            [[ -n "${R2_BUCKET_NAME}" ]] || missing+=("R2_BUCKET_NAME")
          fi

          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          missing_csv="$(IFS=,; echo "${missing[*]}")"
          echo "ready=false" >> "${GITHUB_OUTPUT}"
          echo "missing=${missing_csv}" >> "${GITHUB_OUTPUT}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "::error::Android OTA 缺少必需配置: ${missing_csv}"
            exit 1
          fi

          echo "::warning::自动 OTA 已跳过，缺少必需配置: ${missing_csv}"

      - name: Checkout repository
        if: steps.prereq.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.params.outputs.target_ref }}

      - name: Resolve bundle metadata
        id: bundle
        if: steps.prereq.outputs.ready == 'true'
        shell: bash
        run: |
          short_sha="$(git rev-parse --short=7 HEAD)"
          current_ref="$(git rev-parse HEAD)"
          package_version="$(node -p "require('./package.json').version")"
          built_at="$(date -u +%Y-%m-%dT%H-%M-%S-%3NZ)"
          manifest_url="${{ vars.VITE_ASSETS_BASE_URL || 'https://assets.easyboardgame.top/official' }}/app-updates/android/${{ steps.params.outputs.channel }}/latest.json"

          if [[ -z "${{ steps.params.outputs.expected_base_version }}" ]]; then
            echo "::error::禁止隐式版本发布：expected_base_version 不能为空。"
            exit 1
          fi

          if [[ "${package_version}" != "${{ steps.params.outputs.expected_base_version }}" ]]; then
            echo "::error::Android OTA 基线版本不匹配：expected_base_version=${{ steps.params.outputs.expected_base_version }}，package.json.version=${package_version}"
            exit 1
          fi

          bundle_version="${package_version}-ota-${built_at}"
          notes="GitHub Actions ${{ steps.params.outputs.source_mode }} OTA publish ${current_ref}@${short_sha}"

          {
            echo "short_sha=${short_sha}"
            echo "current_ref=${current_ref}"
            echo "package_version=${package_version}"
            echo "manifest_url=${manifest_url}"
            echo "bundle_version=${bundle_version}"
            echo "notes=${notes}"
          } >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        if: steps.prereq.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24.1.0
          cache: npm

      - name: Install dependencies
        if: steps.prereq.outputs.ready == 'true'
        run: npm ci

      - name: Create Android OTA env file
        if: steps.prereq.outputs.ready == 'true'
        shell: bash
        run: |
          cat <<EOF > .env.android
          VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL || vars.ANDROID_VITE_BACKEND_URL || secrets.VITE_BACKEND_URL || secrets.ANDROID_VITE_BACKEND_URL }}
          VITE_ASSETS_BASE_URL=${{ vars.VITE_ASSETS_BASE_URL || 'https://assets.easyboardgame.top/official' }}
          CAPACITOR_APP_ID=${{ vars.CAPACITOR_APP_ID || 'top.easyboardgame.app' }}
          CAPACITOR_APP_NAME=${{ vars.CAPACITOR_APP_NAME || '易桌游' }}
          ANDROID_WEBVIEW_MODE=embedded
          VITE_ANDROID_OTA_ENABLED=true
          VITE_ANDROID_OTA_MANIFEST_URL=${{ steps.bundle.outputs.manifest_url }}
          VITE_ANDROID_OTA_CHANNEL=${{ steps.params.outputs.channel }}
          VITE_ANDROID_OTA_APP_READY_TIMEOUT_MS=${{ vars.ANDROID_OTA_APP_READY_TIMEOUT_MS || '15000' }}
          EOF

      - name: Build Android web bundle
        if: steps.prereq.outputs.ready == 'true'
        run: npm run mobile:android:sync

      - name: Publish Android OTA bundle
        if: steps.prereq.outputs.ready == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        shell: bash
        run: |
          args=(
            --channel "${{ steps.params.outputs.channel }}"
            --version "${{ steps.bundle.outputs.bundle_version }}"
            --expected-base-version "${{ steps.params.outputs.expected_base_version }}"
            --notes "${{ steps.bundle.outputs.notes }}"
          )

          if [[ "${{ steps.params.outputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi

          if [[ "${{ steps.params.outputs.skip_latest }}" == "true" ]]; then
            args+=(--skip-latest)
          fi

          if [[ "${{ steps.params.outputs.force_update }}" == "false" ]]; then
            args+=(--no-force-update)
          else
            args+=(--force-update)
          fi

          if [[ -n "${{ steps.params.outputs.force_update_title }}" ]]; then
            args+=(--force-update-title "${{ steps.params.outputs.force_update_title }}")
          fi

          if [[ -n "${{ steps.params.outputs.force_update_message }}" ]]; then
            args+=(--force-update-message "${{ steps.params.outputs.force_update_message }}")
          fi

          npm run mobile:android:ota:publish -- "${args[@]}"

      - name: Write workflow summary
        shell: bash
        run: |
          {
            echo "### Android OTA 发布结果"
            echo ""
            echo "| 字段 | 值 |"
            echo "|---|---|"
            echo "| 来源 | ${{ steps.params.outputs.source_mode }} |"
            echo "| Channel | ${{ steps.params.outputs.channel }} |"
            echo "| 结果 | ${{ steps.prereq.outputs.ready == 'true' && '已执行' || '已跳过' }} |"
            echo "| Git Ref | ${{ steps.bundle.outputs.current_ref || steps.params.outputs.target_ref }} |"
            echo "| Expected Base Version | ${{ steps.params.outputs.expected_base_version || '未提供' }} |"
            echo "| Bundle Version | ${{ steps.bundle.outputs.bundle_version || '未生成' }} |"
            echo "| Dry Run | ${{ steps.params.outputs.dry_run }} |"
            echo "| Skip Latest | ${{ steps.params.outputs.skip_latest }} |"
            echo "| Force Update | ${{ steps.params.outputs.force_update || 'false' }} |"
            echo "| Native Compatibility Gate | disabled（所有版本都必须更新） |"
            echo "| Manifest URL | ${{ steps.bundle.outputs.manifest_url || '未生成' }} |"
            echo "| 缺失配置 | ${{ steps.prereq.outputs.missing || '无' }} |"
          } >> "${GITHUB_STEP_SUMMARY}"
