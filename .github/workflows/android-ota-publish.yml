name: Android OTA Publish

on:
  workflow_dispatch:
    inputs:
      channel:
        description: '目标 OTA channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - gray
          - edge
      git_ref:
        description: '要发布的 git ref（分支、tag 或 commit SHA，留空默认当前触发 ref）'
        required: false
        type: string
      expected_base_version:
        description: '可选 package.json 断言（例如 0.5.33）；提供时必须与发布 ref 的 package.json.version 完全一致'
        required: false
        type: string
      version:
        description: '显式 OTA bundle 内部游标（可选；留空自动按 OTA Version Base + UTC 时间生成）'
        required: false
        type: string
      display_version:
        description: '用户可见更新号（可选，例如 600、601；留空自动递增，最低 600）'
        required: false
        type: string
      product_version:
        description: '商业产品版本（可选；留空使用发布 ref 的 package.json.version 作为兼容展示值）'
        required: false
        type: string
      ota_version_base:
        description: 'OTA 内部游标基线（可选，例如 6.0.0 用于桥接旧客户端；留空默认 package.json.version）'
        required: false
        type: string
      dry_run:
        description: '仅预演，不上传'
        required: true
        default: false
        type: boolean
      skip_latest:
        description: '仅允许 dry_run 诊断；正式发布禁止跳过 latest.json'
        required: true
        default: false
        type: boolean
      force_update:
        description: '兼容旧触发器的强制更新字段；项目规定必须为 true'
        required: true
        default: true
        type: boolean
      force_update_title:
        description: '强更页标题（可选）'
        required: false
        type: string
      force_update_message:
        description: '强更页正文（可选）'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', inputs.channel) || github.run_id }}
  cancel-in-progress: true

jobs:
  publish-ota:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && !inputs.dry_run && 'android-ota-production' || 'android-ota-nonprod' }}
    env:
      BG_ASSET_SERVER_PROPAGATION_TIMEOUT_MS: 1800000
      BG_VITE_BACKEND_URL_VAR: ${{ vars.VITE_BACKEND_URL || '' }}
      BG_VITE_BACKEND_URL_SECRET: ${{ secrets.VITE_BACKEND_URL || '' }}
      BG_VITE_ANDROID_BACKEND_URL_VAR: ${{ vars.VITE_ANDROID_BACKEND_URL || '' }}
      BG_VITE_ANDROID_BACKEND_URL_SECRET: ${{ secrets.VITE_ANDROID_BACKEND_URL || '' }}
      BG_ANDROID_VITE_BACKEND_URL_VAR: ${{ vars.ANDROID_VITE_BACKEND_URL || '' }}
      BG_ANDROID_VITE_BACKEND_URL_SECRET: ${{ secrets.ANDROID_VITE_BACKEND_URL || '' }}
      BG_ANDROID_BACKEND_URL_VAR: ${{ vars.ANDROID_BACKEND_URL || '' }}
      BG_ANDROID_BACKEND_URL_SECRET: ${{ secrets.ANDROID_BACKEND_URL || '' }}
      ANDROID_DOWNLOAD_ASSETS_BASE_URL: ${{ vars.VITE_ANDROID_DOWNLOAD_ASSETS_BASE_URL || vars.ANDROID_DOWNLOAD_ASSETS_BASE_URL || vars.VITE_ANDROID_ASSETS_BASE_URL || vars.ANDROID_VITE_ASSETS_BASE_URL || 'http://8.148.71.102/official' }}
      ANDROID_CONTROL_ASSETS_BASE_URL: ${{ vars.VITE_ANDROID_CONTROL_ASSETS_BASE_URL || vars.ANDROID_CONTROL_ASSETS_BASE_URL || 'https://assets.easyboardgame.top/official' }}

    steps:
      - name: Resolve publish parameters
        id: params
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            channel="${{ inputs.channel }}"
            target_ref="${{ inputs.git_ref }}"
            dry_run="${{ inputs.dry_run }}"
            skip_latest="${{ inputs.skip_latest }}"
            force_update="${{ inputs.force_update }}"
            force_update_title="${{ inputs.force_update_title }}"
            force_update_message="${{ inputs.force_update_message }}"
            expected_base_version="${{ inputs.expected_base_version }}"
            explicit_version="${{ inputs.version }}"
            display_version="${{ inputs.display_version }}"
            product_version="${{ inputs.product_version }}"
            ota_version_base="${{ inputs.ota_version_base }}"
            source_mode="manual"
          else
            echo "::error::自动 OTA 已禁用；请使用 workflow_dispatch 显式发布。"
            exit 1
          fi

          if [[ -z "${target_ref}" ]]; then
            target_ref="${GITHUB_SHA}"
          fi

          if [[ "${force_update}" != "true" ]]; then
            echo "::error::所有 OTA 已强制更新，force_update 必须为 true。"
            exit 1
          fi

          if [[ "${skip_latest}" == "true" && "${dry_run}" != "true" ]]; then
            echo "::error::正式 Android OTA 发布禁止跳过 latest.json。手机端依赖 latest.json 发现更新，跳过会导致无法更新。"
            exit 1
          fi

          {
            echo "channel=${channel}"
            echo "target_ref=${target_ref}"
            echo "expected_base_version=${expected_base_version}"
            echo "explicit_version=${explicit_version}"
            echo "display_version=${display_version}"
            echo "product_version=${product_version}"
            echo "ota_version_base=${ota_version_base}"
            echo "dry_run=${dry_run}"
            echo "skip_latest=${skip_latest}"
            echo "force_update=${force_update}"
            echo "force_update_title=${force_update_title}"
            echo "force_update_message=${force_update_message}"
            echo "source_mode=${source_mode}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate OTA prerequisites
        id: prereq
        shell: bash
        env:
          ASSET_SERVER_UPLOAD_URL: ${{ vars.ASSET_SERVER_UPLOAD_URL || secrets.ASSET_SERVER_UPLOAD_URL || 'https://assets-upload.easyboardgame.top/asset-publish' }}
          ASSET_SERVER_UPLOAD_TOKEN: ${{ secrets.ASSET_SERVER_UPLOAD_TOKEN || secrets.BG_ASSET_PUBLISH_TOKEN }}
          DRY_RUN: ${{ steps.params.outputs.dry_run }}
        run: |
          missing=()

          if [[ "${DRY_RUN}" != "true" ]]; then
            [[ -n "${ASSET_SERVER_UPLOAD_TOKEN}" ]] || missing+=("ASSET_SERVER_UPLOAD_TOKEN")
          fi

          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          missing_csv="$(IFS=,; echo "${missing[*]}")"
          echo "ready=false" >> "${GITHUB_OUTPUT}"
          echo "missing=${missing_csv}" >> "${GITHUB_OUTPUT}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "::error::Android OTA 缺少必需配置: ${missing_csv}"
            exit 1
          fi

          echo "::warning::自动 OTA 已跳过，缺少必需配置: ${missing_csv}"

      - name: Checkout repository
        if: steps.prereq.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.params.outputs.target_ref }}

      - name: Resolve Android backend URL
        id: backend
        if: steps.prereq.outputs.ready == 'true'
        shell: bash
        run: |
          backend_url="$(node --input-type=module -e "import { resolveAndroidBackendUrl } from './scripts/mobile/android-backend-url.mjs'; console.log(resolveAndroidBackendUrl(process.env))")"
          echo "ANDROID_BACKEND_URL=${backend_url}" >> "${GITHUB_ENV}"
          echo "backend_url=${backend_url}" >> "${GITHUB_OUTPUT}"

      - name: Prepare asset SSH fallback
        if: steps.prereq.outputs.ready == 'true' && steps.params.outputs.dry_run != 'true'
        shell: bash
        env:
          ASSET_SERVER_SSH_PRIVATE_KEY: ${{ secrets.ASSET_SERVER_SSH_PRIVATE_KEY }}
          ASSET_SERVER_SSH_KNOWN_HOSTS: ${{ secrets.ASSET_SERVER_SSH_KNOWN_HOSTS }}
        run: |
          missing=()
          [[ -n "${ASSET_SERVER_SSH_PRIVATE_KEY}" ]] || missing+=("ASSET_SERVER_SSH_PRIVATE_KEY")
          [[ -n "${ASSET_SERVER_SSH_KNOWN_HOSTS}" ]] || missing+=("ASSET_SERVER_SSH_KNOWN_HOSTS")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Android OTA SSH fallback 缺少配置: ${missing[*]}"
            exit 1
          fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${ASSET_SERVER_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/asset-publisher"
          printf '%s\n' "${ASSET_SERVER_SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/asset-publisher" "${HOME}/.ssh/known_hosts"

      - name: Resolve bundle metadata
        id: bundle
        if: steps.prereq.outputs.ready == 'true'
        shell: bash
        run: |
          short_sha="$(git rev-parse --short=7 HEAD)"
          current_ref="$(git rev-parse HEAD)"
          package_version="$(node -p "require('./package.json').version")"
          built_at="$(date -u +%Y-%m-%dT%H-%M-%S-%3NZ)"
          manifest_url="${ANDROID_CONTROL_ASSETS_BASE_URL}/app-updates/android/${{ steps.params.outputs.channel }}/latest.json"
          fallback_manifest_url="${ANDROID_DOWNLOAD_ASSETS_BASE_URL}/app-updates/android/${{ steps.params.outputs.channel }}/latest.json"
          product_version="${{ steps.params.outputs.product_version }}"
          ota_version_base="${{ steps.params.outputs.ota_version_base }}"
          explicit_version="${{ steps.params.outputs.explicit_version }}"

          if [[ -n "${{ steps.params.outputs.expected_base_version }}" && "${package_version}" != "${{ steps.params.outputs.expected_base_version }}" ]]; then
            echo "::error::Android OTA 基线版本不匹配：expected_base_version=${{ steps.params.outputs.expected_base_version }}，package.json.version=${package_version}"
            exit 1
          fi

          if [[ -z "${product_version}" ]]; then
            product_version="${package_version}"
          fi

          ota_version_base="$(node --input-type=module -e "import { resolveAndroidOtaVersionBase } from './scripts/mobile/ota-publish-config.mjs'; console.log(resolveAndroidOtaVersionBase({ packageVersion: process.argv[1], requestedVersionBase: process.argv[2] }))" "${package_version}" "${ota_version_base}")"

          if [[ ! "${ota_version_base}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::OTA 内部游标基线非法：${ota_version_base}"
            exit 1
          fi

          if [[ -n "${explicit_version}" ]]; then
            node --input-type=module -e "import { resolveAndroidOtaVersionBase } from './scripts/mobile/ota-publish-config.mjs'; resolveAndroidOtaVersionBase({ packageVersion: process.argv[1], requestedVersionBase: process.argv[2] })" "${package_version}" "${explicit_version}"
            if [[ ! "${explicit_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?(-ota-[0-9TZ.-]+)?$ ]]; then
              echo "::error::显式 OTA 内部游标非法：${explicit_version}"
              exit 1
            fi
            bundle_version="${explicit_version}"
          else
            bundle_version="${ota_version_base}-ota-${built_at}"
          fi
          notes="GitHub Actions ${{ steps.params.outputs.source_mode }} OTA publish ${current_ref}@${short_sha}"

          {
            echo "short_sha=${short_sha}"
            echo "current_ref=${current_ref}"
            echo "package_version=${package_version}"
            echo "product_version=${product_version}"
            echo "manifest_url=${manifest_url}"
            echo "fallback_manifest_url=${fallback_manifest_url}"
            echo "ota_version_base=${ota_version_base}"
            echo "bundle_version=${bundle_version}"
            echo "notes=${notes}"
          } >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        if: steps.prereq.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24.1.0
          cache: npm

      - name: Install dependencies
        if: steps.prereq.outputs.ready == 'true'
        run: npm ci

      - name: Create Android OTA env file
        if: steps.prereq.outputs.ready == 'true'
        shell: bash
        run: |
          cat <<EOF > .env.android
          VITE_BACKEND_URL=${{ steps.backend.outputs.backend_url }}
          VITE_ANDROID_BACKEND_URL=${{ steps.backend.outputs.backend_url }}
          VITE_ASSETS_BASE_URL=${{ env.ANDROID_DOWNLOAD_ASSETS_BASE_URL }}
          VITE_ANDROID_DOWNLOAD_ASSETS_BASE_URL=${{ env.ANDROID_DOWNLOAD_ASSETS_BASE_URL }}
          VITE_ANDROID_CONTROL_ASSETS_BASE_URL=${{ env.ANDROID_CONTROL_ASSETS_BASE_URL }}
          VITE_MOBILE_PACKAGE_MANIFEST_URL=${{ env.ANDROID_DOWNLOAD_ASSETS_BASE_URL }}/mobile-packages/android
          CAPACITOR_APP_ID=${{ vars.CAPACITOR_APP_ID || 'top.easyboardgame.app' }}
          CAPACITOR_APP_NAME=${{ vars.CAPACITOR_APP_NAME || '易桌游' }}
          ANDROID_WEBVIEW_MODE=embedded
          VITE_ANDROID_OTA_ENABLED=true
          VITE_ANDROID_OTA_MANIFEST_URL=${{ steps.bundle.outputs.manifest_url }}
          VITE_ANDROID_OTA_MANIFEST_FALLBACK_URLS=${{ steps.bundle.outputs.fallback_manifest_url }}
          VITE_ANDROID_OTA_CHANNEL=${{ steps.params.outputs.channel }}
          VITE_ANDROID_OTA_APP_READY_TIMEOUT_MS=${{ vars.ANDROID_OTA_APP_READY_TIMEOUT_MS || '15000' }}
          EOF

      - name: Build Android web bundle
        if: steps.prereq.outputs.ready == 'true'
        run: npm run mobile:android:sync

      - name: Publish Android OTA bundle
        if: steps.prereq.outputs.ready == 'true'
        env:
          ASSET_SERVER_UPLOAD_URL: ${{ vars.ASSET_SERVER_UPLOAD_URL || secrets.ASSET_SERVER_UPLOAD_URL || 'https://assets-upload.easyboardgame.top/asset-publish' }}
          ASSET_SERVER_UPLOAD_TOKEN: ${{ secrets.ASSET_SERVER_UPLOAD_TOKEN || secrets.BG_ASSET_PUBLISH_TOKEN }}
          ASSET_SERVER_ALLOW_SSH_FALLBACK: '1'
          ASSET_SERVER_SSH_TARGET: ${{ vars.ASSET_SERVER_SSH_TARGET || 'admin@8.148.71.102' }}
          ASSET_SERVER_SSH_KEY_PATH: /home/runner/.ssh/asset-publisher
          ASSET_SERVER_SSH_KNOWN_HOSTS_PATH: /home/runner/.ssh/known_hosts
        shell: bash
        run: |
          args=(
            --channel "${{ steps.params.outputs.channel }}"
            --version "${{ steps.bundle.outputs.bundle_version }}"
            --ota-version-base "${{ steps.bundle.outputs.ota_version_base }}"
            --product-version "${{ steps.bundle.outputs.product_version }}"
            --notes "${{ steps.bundle.outputs.notes }}"
          )

          if [[ -n "${{ steps.params.outputs.expected_base_version }}" ]]; then
            args+=(--expected-base-version "${{ steps.params.outputs.expected_base_version }}")
          fi

          if [[ "${{ steps.params.outputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi

          if [[ "${{ steps.params.outputs.skip_latest }}" == "true" ]]; then
            args+=(--skip-latest)
          fi

          args+=(--force-update)

          if [[ -n "${{ steps.params.outputs.force_update_title }}" ]]; then
            args+=(--force-update-title "${{ steps.params.outputs.force_update_title }}")
          fi

          if [[ -n "${{ steps.params.outputs.force_update_message }}" ]]; then
            args+=(--force-update-message "${{ steps.params.outputs.force_update_message }}")
          fi

          if [[ -n "${{ steps.params.outputs.display_version }}" ]]; then
            args+=(--display-version "${{ steps.params.outputs.display_version }}")
          fi

          npm run mobile:android:ota:publish -- "${args[@]}"

      - name: Write workflow summary
        shell: bash
        run: |
          {
            echo "### Android OTA 发布结果"
            echo ""
            echo "| 字段 | 值 |"
            echo "|---|---|"
            echo "| 来源 | ${{ steps.params.outputs.source_mode }} |"
            echo "| Channel | ${{ steps.params.outputs.channel }} |"
            echo "| 结果 | ${{ steps.prereq.outputs.ready == 'true' && '已执行' || '已跳过' }} |"
            echo "| Git Ref | ${{ steps.bundle.outputs.current_ref || steps.params.outputs.target_ref }} |"
            echo "| Package Version Assertion | ${{ steps.params.outputs.expected_base_version || '未提供' }} |"
            echo "| Product Version | ${{ steps.bundle.outputs.product_version || '未生成' }} |"
            echo "| OTA Version Base | ${{ steps.bundle.outputs.ota_version_base || '未生成' }} |"
            echo "| Bundle Version | ${{ steps.bundle.outputs.bundle_version || '未生成' }} |"
            echo "| Display Version | ${{ steps.params.outputs.display_version || '自动递增' }} |"
            echo "| Dry Run | ${{ steps.params.outputs.dry_run }} |"
            echo "| Skip Latest | ${{ steps.params.outputs.skip_latest }} |"
            echo "| Force Update | true（项目硬门禁） |"
            echo "| Native Compatibility Gate | disabled（所有版本都必须更新） |"
            echo "| Manifest URL | ${{ steps.bundle.outputs.manifest_url || '未生成' }} |"
            echo "| Fallback Manifest URL | ${{ steps.bundle.outputs.fallback_manifest_url || '未生成' }} |"
            echo "| 缺失配置 | ${{ steps.prereq.outputs.missing || '无' }} |"
          } >> "${GITHUB_STEP_SUMMARY}"
