name: Android Push Release

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'postcss.config.js'
      - 'postcss-tailwind-*.js'
      - 'tsconfig*.json'
      - 'scripts/game/**'
      - 'scripts/audio/generate-slim-registry.mjs'
      - 'scripts/mobile/**'
      - '.github/workflows/android-push-release.yml'
      - '.github/workflows/android-ota-publish.yml'
      - '.github/workflows/android-native-update-publish.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release-on-main-push:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip android release]')
    runs-on: ubuntu-latest
    env:
      AUTO_BUMP_VERSION: ${{ vars.ANDROID_AUTO_BUMP_VERSION || 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read current release version
        id: current_version
        shell: bash
        run: |
          current_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          echo "current_version=${current_version}" >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.1.0
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Create Android env file
        shell: bash
        run: |
          cat <<EOF > .env.android
          VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL || vars.ANDROID_VITE_BACKEND_URL || secrets.VITE_BACKEND_URL || secrets.ANDROID_VITE_BACKEND_URL }}
          VITE_ASSETS_BASE_URL=${{ vars.VITE_ASSETS_BASE_URL || 'https://assets.easyboardgame.top/official' }}
          CAPACITOR_APP_ID=${{ vars.CAPACITOR_APP_ID || 'top.easyboardgame.app' }}
          CAPACITOR_APP_NAME=${{ vars.CAPACITOR_APP_NAME || '易桌游' }}
          ANDROID_WEBVIEW_MODE=embedded
          VITE_ANDROID_OTA_ENABLED=true
          VITE_ANDROID_OTA_MANIFEST_URL=${{ vars.VITE_ASSETS_BASE_URL || 'https://assets.easyboardgame.top/official' }}/app-updates/android/stable/latest.json
          VITE_ANDROID_OTA_CHANNEL=stable
          VITE_ANDROID_OTA_APP_READY_TIMEOUT_MS=${{ vars.ANDROID_OTA_APP_READY_TIMEOUT_MS || '15000' }}
          ANDROID_ICON_SOURCE=${{ vars.ANDROID_ICON_SOURCE || 'public/logos/logo_1_grid.png' }}
          ANDROID_SPLASH_SOURCE=${{ vars.ANDROID_SPLASH_SOURCE || 'public/logos/logo_1_grid.png' }}
          ANDROID_ICON_BACKGROUND=${{ vars.ANDROID_ICON_BACKGROUND || '#FFFFFF' }}
          ANDROID_SPLASH_BACKGROUND=${{ vars.ANDROID_SPLASH_BACKGROUND || '#FFFFFF' }}
          EOF

      - name: Release Android stable OTA bundle
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node scripts/mobile/release-android.mjs ota --channel stable

      - name: Bump next patch version
        id: next_version
        if: env.AUTO_BUMP_VERSION == 'true'
        shell: bash
        run: |
          bump_output="$(node scripts/mobile/bump-project-version.mjs --bump patch)"
          echo "${bump_output}"
          next_version="$(echo "${bump_output}" | awk -F= '/^nextVersion=/{print $2}')"
          echo "next_version=${next_version}" >> "${GITHUB_OUTPUT}"

      - name: Commit next development version
        if: env.AUTO_BUMP_VERSION == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No version files changed; skip commit."
            exit 0
          fi
          git commit -m "chore：回写 Android 版本到 ${{ steps.next_version.outputs.next_version }} [skip android release]"
          git push

      - name: Write workflow summary
        shell: bash
        run: |
          {
            echo "### Android push 自动发版结果"
            echo ""
            echo "| 字段 | 值 |"
            echo "|---|---|"
            echo "| 发布版本 | ${{ steps.current_version.outputs.current_version }} |"
            echo "| 发布内容 | stable OTA |"
            echo "| 触发方式 | push main |"
            if [[ "${AUTO_BUMP_VERSION}" == "true" ]]; then
              echo "| 下一开发版本 | ${{ steps.next_version.outputs.next_version }} |"
              echo "| 版本回写 | 已提交到 main（带 [skip android release]） |"
            else
              echo "| 下一开发版本 | 未回写（手动维护） |"
              echo "| 版本回写 | 已关闭 |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
