name: CI SCP Benchmark

on:
  workflow_dispatch:
    inputs:
      size_mb:
        description: 'Benchmark file size in MiB'
        required: true
        default: '150'
        type: string

permissions:
  contents: read

jobs:
  scp-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate input
        id: input
        shell: bash
        run: |
          size_mb='${{ inputs.size_mb }}'
          if ! [[ "${size_mb}" =~ ^[0-9]+$ ]]; then
            echo "::error::size_mb must be an integer"
            exit 1
          fi
          if (( size_mb < 1 || size_mb > 1024 )); then
            echo "::error::size_mb must be between 1 and 1024"
            exit 1
          fi
          echo "size_mb=${size_mb}" >> "${GITHUB_OUTPUT}"

      - name: Configure SSH
        shell: bash
        env:
          CI_SCP_BENCHMARK_SSH_PRIVATE_KEY: ${{ secrets.CI_SCP_BENCHMARK_SSH_PRIVATE_KEY }}
          ASSET_SERVER_SSH_KNOWN_HOSTS: ${{ secrets.ASSET_SERVER_SSH_KNOWN_HOSTS }}
        run: |
          test -n "${CI_SCP_BENCHMARK_SSH_PRIVATE_KEY}"
          test -n "${ASSET_SERVER_SSH_KNOWN_HOSTS}"
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${CI_SCP_BENCHMARK_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/ci-scp-benchmark"
          chmod 600 "${HOME}/.ssh/ci-scp-benchmark"
          printf '%s\n' "${ASSET_SERVER_SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Generate benchmark payload
        id: payload
        shell: bash
        run: |
          size_mb='${{ steps.input.outputs.size_mb }}'
          file="/tmp/boardgame-ci-scp-benchmark-${GITHUB_RUN_ID}.bin"
          dd if=/dev/urandom of="${file}" bs=1M count="${size_mb}" status=none
          bytes=$(wc -c < "${file}")
          echo "file=${file}" >> "${GITHUB_OUTPUT}"
          echo "bytes=${bytes}" >> "${GITHUB_OUTPUT}"

      - name: SCP to production host and verify
        id: scp
        shell: bash
        env:
          TARGET: ${{ vars.ASSET_SERVER_SSH_TARGET || 'admin@8.148.71.102' }}
        run: |
          file='${{ steps.payload.outputs.file }}'
          remote="/tmp/boardgame-ci-scp-benchmark-${GITHUB_RUN_ID}.bin"
          key="${HOME}/.ssh/ci-scp-benchmark"
          ssh_opts=(-i "${key}" -o IdentitiesOnly=yes -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" -o StrictHostKeyChecking=yes)
          start=$(date +%s%3N)
          scp "${ssh_opts[@]}" "${file}" "${TARGET}:${remote}"
          end=$(date +%s%3N)
          seconds=$(awk "BEGIN { printf \"%.3f\", (${end}-${start})/1000 }")
          remote_bytes=$(ssh "${ssh_opts[@]}" "${TARGET}" "wc -c < '${remote}'")
          ssh "${ssh_opts[@]}" "${TARGET}" "rm -f '${remote}'"
          echo "seconds=${seconds}" >> "${GITHUB_OUTPUT}"
          echo "remote_bytes=${remote_bytes}" >> "${GITHUB_OUTPUT}"

      - name: Summary
        shell: bash
        run: |
          bytes='${{ steps.payload.outputs.bytes }}'
          seconds='${{ steps.scp.outputs.seconds }}'
          mb=$(awk "BEGIN { printf \"%.2f\", ${bytes}/1024/1024 }")
          mbps=$(awk "BEGIN { printf \"%.2f\", (${bytes}/1024/1024)/${seconds} }")
          {
            echo "### CI SCP Benchmark"
            echo ""
            echo "| Field | Value |"
            echo "|---|---:|"
            echo "| Payload | ${mb} MiB |"
            echo "| SCP seconds | ${seconds} |"
            echo "| Throughput | ${mbps} MiB/s |"
            echo "| Remote bytes | ${{ steps.scp.outputs.remote_bytes }} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "RESULT payload_mib=${mb} scp_seconds=${seconds} throughput_mib_s=${mbps} remote_bytes=${{ steps.scp.outputs.remote_bytes }}"