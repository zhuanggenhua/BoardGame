<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BoardGame E2E 图片查看器</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="title-block">
        <h1>E2E 图片画布</h1>
        <p id="directory" class="directory">等待目录...</p>
      </div>
      <div class="actions" role="group" aria-label="画布控制">
        <button id="zoomOut" type="button" title="缩小">-</button>
        <button id="zoomIn" type="button" title="放大">+</button>
        <button id="fitView" type="button">适配</button>
        <button id="resetView" type="button">重置</button>
        <label class="toggle">
          <input id="autoRefresh" type="checkbox" checked />
          自动刷新
        </label>
        <button id="refresh" type="button">刷新</button>
      </div>
    </header>

    <main class="workspace">
      <div class="content">
        <aside id="indexPanel" class="index-panel" aria-label="截图索引">
          <div class="index-header">
            <div class="index-title">
              <strong>截图索引</strong>
              <span id="indexMeta">读取中...</span>
            </div>
            <button id="toggleIndex" class="index-toggle" type="button" aria-expanded="true" aria-label="收起截图索引" title="收起截图索引">&lt;</button>
          </div>
          <div id="indexList" class="index-list"></div>
        </aside>
        <section id="viewport" class="viewport" aria-label="E2E 图片画布">
          <div id="empty" class="empty">正在读取截图目录...</div>
          <div id="board" class="board"></div>
          <section id="imageDetail" class="image-detail" aria-hidden="true" aria-label="原图详情">
            <header class="image-detail-header">
              <div class="image-detail-title">
                <strong id="imageDetailTitle">原图详情</strong>
                <span id="imageDetailDescription"></span>
              </div>
              <button id="imageDetailClose" class="image-detail-close" type="button" aria-label="关闭原图详情" title="关闭原图详情">×</button>
            </header>
            <div class="image-detail-nav" aria-label="原图切换">
              <button id="imageDetailPrevious" class="image-detail-nav-button" type="button" aria-label="上一张图片" title="上一张图片">‹</button>
              <button id="imageDetailNext" class="image-detail-nav-button" type="button" aria-label="下一张图片" title="下一张图片">›</button>
            </div>
            <div id="imageDetailViewport" class="image-detail-viewport" aria-label="原图查看区域"></div>
            <footer class="image-detail-status">
              <span id="imageDetailSummary">点击图片后加载原图。</span>
              <span id="imageDetailPosition" aria-live="polite"></span>
              <span>左右箭头切换，滚轮缩放，拖拽平移，Esc 返回总览</span>
            </footer>
          </section>
        </section>
      </div>
      <footer class="statusbar">
        <span id="summary">正在读取...</span>
        <span id="selection">拖拽画布或图片平移，滚轮缩放。</span>
      </footer>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
