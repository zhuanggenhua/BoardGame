<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FantasyRealms Mahjong-Table Desktop Layout</title>
  <desc id="desc">Low-fidelity desktop layout for FantasyRealms using a mahjong-table inspired information hierarchy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f1d13"/>
      <stop offset="100%" stop-color="#21130d"/>
    </linearGradient>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#315949"/>
      <stop offset="100%" stop-color="#24453a"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0dfb8"/>
      <stop offset="100%" stop-color="#d8bb7e"/>
    </linearGradient>
    <style>
      .label { font: 700 26px 'Microsoft YaHei', sans-serif; fill: #f6e4bf; letter-spacing: 1px; }
      .small { font: 600 18px 'Microsoft YaHei', sans-serif; fill: #f2ddb2; }
      .tiny { font: 600 15px 'Microsoft YaHei', sans-serif; fill: #dfc99f; }
      .dark { fill: #2a190f; }
      .paperText { font: 700 20px 'Microsoft YaHei', sans-serif; fill: #2e1b11; }
      .zone { fill: rgba(255,255,255,0.04); stroke: rgba(245,225,184,0.2); stroke-width: 2; }
      .card { fill: #ead8af; stroke: #d5b879; stroke-width: 2; }
      .chip { fill: rgba(68,41,24,0.86); stroke: rgba(225,189,122,0.35); stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="28" y="28" width="1544" height="844" rx="30" fill="url(#felt)" stroke="rgba(224,191,127,0.22)" stroke-width="3"/>

  <rect x="60" y="60" width="240" height="96" rx="24" class="chip"/>
  <text x="82" y="95" class="tiny">左上角标</text>
  <text x="82" y="128" class="label">牌库 + 回合</text>

  <rect x="1230" y="60" width="300" height="96" rx="24" class="chip"/>
  <text x="1252" y="95" class="tiny">右上窄带</text>
  <text x="1252" y="128" class="label">当前总分 / 排名</text>

  <rect x="170" y="188" width="1260" height="370" rx="36" class="zone"/>
  <text x="210" y="238" class="label">中央公开弃牌河</text>
  <text x="210" y="272" class="small">承担全桌公共信息，默认 2 行河式网格；空态保持紧凑，不做巨型空盒</text>

  <g transform="translate(245 315)">
    <rect x="0" y="0" width="130" height="188" rx="16" class="card"/>
    <rect x="150" y="0" width="130" height="188" rx="16" class="card"/>
    <rect x="300" y="0" width="130" height="188" rx="16" class="card"/>
    <rect x="450" y="0" width="130" height="188" rx="16" class="card"/>
    <rect x="600" y="0" width="130" height="188" rx="16" class="card"/>
    <rect x="750" y="0" width="130" height="188" rx="16" class="card"/>
    <rect x="900" y="0" width="130" height="188" rx="16" class="card"/>
    <rect x="75" y="106" width="130" height="188" rx="16" class="card"/>
    <rect x="225" y="106" width="130" height="188" rx="16" class="card"/>
    <rect x="375" y="106" width="130" height="188" rx="16" class="card"/>
    <rect x="525" y="106" width="130" height="188" rx="16" class="card"/>
    <rect x="675" y="106" width="130" height="188" rx="16" class="card"/>
    <rect x="825" y="106" width="130" height="188" rx="16" class="card"/>
  </g>

  <rect x="1120" y="585" width="320" height="190" rx="26" fill="url(#paper)" stroke="rgba(213,184,121,0.75)" stroke-width="2"/>
  <text x="1150" y="626" class="paperText">右下贴边焦点便签</text>
  <text x="1150" y="664" class="paperText">焦点牌 + 分数推演</text>
  <text x="1150" y="702" class="paperText">只贴边，不再占整列</text>

  <rect x="120" y="640" width="1320" height="190" rx="32" class="zone"/>
  <text x="160" y="684" class="label">底部 7 张手牌操作带</text>
  <text x="160" y="718" class="small">最长、最连续、最靠近玩家的区域；必须是首屏第一操作对象</text>

  <g transform="translate(208 730)">
    <rect x="0" y="0" width="130" height="74" rx="14" class="card"/>
    <rect x="160" y="-6" width="130" height="80" rx="14" class="card"/>
    <rect x="320" y="-10" width="130" height="86" rx="14" class="card"/>
    <rect x="480" y="-14" width="130" height="92" rx="14" class="card"/>
    <rect x="640" y="-10" width="130" height="86" rx="14" class="card"/>
    <rect x="800" y="-6" width="130" height="80" rx="14" class="card"/>
    <rect x="960" y="0" width="130" height="74" rx="14" class="card"/>
  </g>

  <text x="78" y="852" class="tiny">禁止项：三栏等权布局 / 巨型空态盒子 / 右侧整列说明栏 / 在 PC 未过验收前先转移动端</text>
</svg>
