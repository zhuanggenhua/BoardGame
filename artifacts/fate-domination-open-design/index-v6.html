<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>命运支配开放设计当前工作稿</title>
  <style>
    :root {
      --ink: #111516;
      --ink-soft: #202729;
      --paper: #f5efe5;
      --muted: #b7ada0;
      --gold: #e7b943;
      --gold-soft: #ffe8a0;
      --cyan: #75ddea;
      --red: #bd635b;
      --shadow: rgba(0, 0, 0, .7);
      --card-w: 148px;
      --card-h: 214px;
      --card-gap: 12px;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      color: var(--paper);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #29241f; }
    body { overflow: hidden; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 0;
      overflow: hidden;
      isolation: isolate;
      background:
        repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 2px, transparent 2px 12px),
        repeating-linear-gradient(-45deg, rgba(0,0,0,.09) 0 2px, transparent 2px 16px),
        #51463a;
    }
    .stage::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; box-shadow: inset 0 0 180px rgba(0,0,0,.65); }

    .map-stage { position: absolute; inset: 0; z-index: 1; }
    .map-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .map-viewport.is-panning { cursor: grabbing; }
    .map-content {
      position: absolute;
      left: 0;
      top: 0;
      width: 1927px;
      height: 1179px;
      overflow: visible;
      transform-origin: 0 0;
      will-change: transform;
    }
    .map-board { display: block; width: 1927px; height: 1179px; pointer-events: none; }
    .map-objects { position: absolute; inset: 0; overflow: visible; }

    .board-piece {
      position: absolute;
      z-index: 5;
      width: 4.6%;
      aspect-ratio: 1;
      object-fit: cover;
      pointer-events: none;
      border: 2px solid var(--gold);
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,.55);
      transform: translate(-50%, -50%);
    }
    .piece-shirou { left: 59.99%; top: 14.03%; }
    .piece-shinji { left: 70.52%; top: 46.14%; }
    .piece-kirei { left: 70.47%; top: 78.03%; }
    .piece-rin { left: 11.05%; top: 81.26%; }

    .map-card {
      position: absolute;
      z-index: 4;
      width: 8.2%;
      aspect-ratio: 63 / 88;
      padding: 0;
      cursor: pointer;
      overflow: hidden;
      border: 1px solid rgba(231,185,67,.7);
      background: #090b0b;
      box-shadow: 0 8px 18px rgba(0,0,0,.55);
      transform: translate(-50%, -50%);
    }
    .map-card img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .map-card .pile-tag {
      position: absolute;
      left: 4px;
      right: 4px;
      bottom: 4px;
      padding: 2px 4px;
      background: rgba(8,10,10,.82);
      color: var(--gold-soft);
      font-size: 10px;
      text-align: center;
    }
    .slot-situation { left: 11.0%; top: 16.5%; width: 10.4%; }
    .pile-events, .pile-miyama, .pile-shinto {
      box-shadow:
        7px 7px 0 -1px #090b0b,
        7px 7px 0 0 rgba(231,185,67,.5),
        14px 14px 0 -1px #090b0b,
        14px 14px 0 0 rgba(231,185,67,.32),
        0 8px 18px rgba(0,0,0,.55);
    }
    .pile-events { left: -6.4%; top: 16.5%; }
    .pile-miyama { left: -6.4%; top: 49.5%; }
    .pile-shinto { left: -6.4%; top: 80.8%; }
    .event-slot { z-index: 5; }
    .event-miyama-1 { left: 27.5%; top: 49.8%; width: 11.9%; }
    .event-miyama-2 { left: 39.8%; top: 49.8%; width: 11.9%; }
    .event-miyama-3 { left: 52.1%; top: 49.8%; width: 11.9%; }
    .event-shinto-1 { left: 27.5%; top: 81.85%; width: 11.9%; }
    .event-shinto-2 { left: 39.8%; top: 81.85%; width: 11.9%; }

    .round-chip {
      position: absolute;
      top: 14px;
      left: 16px;
      z-index: 6;
      padding: 8px 12px 8px 10px;
      border-left: 3px solid var(--gold);
      background: rgba(12,13,13,.72);
      pointer-events: none;
      text-shadow: 0 2px 6px #000;
    }
    .round-chip strong { display: block; color: var(--gold-soft); font-size: 15px; }
    .round-chip span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }

    .view-hud {
      position: absolute;
      top: 14px;
      left: 220px;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: rgba(12,13,13,.72);
      color: var(--paper);
      font-size: 11px;
    }
    .view-hud b { color: var(--gold-soft); min-width: 42px; }
    .view-hud button {
      padding: 2px 8px;
      cursor: pointer;
      border: 1px solid rgba(231,185,67,.45);
      color: var(--gold-soft);
      font-size: 11px;
    }
    .view-hud button:hover { border-color: var(--cyan); color: var(--cyan); }

    .opp-rail {
      position: absolute;
      top: 12px;
      right: 10px;
      bottom: 236px;
      z-index: 4;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 420px;
    }
    .opp-seat {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 8px;
      align-items: center;
      padding: 6px 8px;
      cursor: pointer;
      border: 1px solid rgba(231,185,67,.28);
      background: rgba(12,13,13,.78);
    }
    .opp-seat:hover { border-color: var(--gold); }
    .opp-avatars { display: flex; align-items: center; }
    .opp-master-token {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border: 1px solid var(--gold);
      border-radius: 50%;
    }
    .opp-servant-token {
      width: 32px;
      height: 32px;
      margin-left: -14px;
      object-fit: cover;
      border: 1px solid var(--cyan);
      border-radius: 50%;
    }
    .opp-copy {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      white-space: nowrap;
    }
    .opp-copy b { display: inline; font-size: 13px; }
    .opp-copy small { display: inline; margin: 0; color: var(--muted); font-size: 11px; line-height: 1; }
    .opp-copy i { color: var(--gold-soft); font-style: normal; }

    .dock-self {
      position: absolute;
      left: 14px;
      bottom: 14px;
      z-index: 8;
      display: grid;
      gap: 10px;
      width: 210px;
      pointer-events: none;
    }
    .dock-self > * { pointer-events: auto; }
    .self-piles { display: flex; gap: 10px; }
    .mini-pile {
      position: relative;
      width: 72px;
      height: 64px;
      cursor: pointer;
      overflow: hidden;
      border: 1px solid rgba(231,185,67,.55);
      background: #090b0b;
      box-shadow: 0 8px 16px rgba(0,0,0,.45);
    }
    .mini-pile svg { display: block; width: 28px; height: 28px; margin: 3px auto 17px; fill: none; stroke: var(--gold-soft); stroke-width: 1.6; }
    .mini-pile span {
      position: absolute;
      right: 4px;
      bottom: 4px;
      left: 4px;
      padding: 2px 0;
      background: rgba(8,10,10,.82);
      color: var(--gold-soft);
      font-size: 10px;
      text-align: center;
    }

    .command-seals {
      position: relative;
      width: 118px;
      height: 108px;
    }
    .seal {
      position: absolute;
      width: 78px;
      height: 108px;
      cursor: pointer;
      overflow: hidden;
      border: 1px solid rgba(231,185,67,.55);
      background: #090b0b;
      box-shadow: 0 8px 16px rgba(0,0,0,.5);
      transition: transform .15s ease, opacity .2s ease;
    }
    .seal img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .seal[data-seal="0"] { left: 0; top: 10px; z-index: 3; }
    .seal[data-seal="1"] { left: 18px; top: 5px; z-index: 2; }
    .seal[data-seal="2"] { left: 36px; top: 0; z-index: 1; }
    .seal:hover { transform: translateY(-6px); z-index: 5; }
    .seal.is-spent { display: none; }

    .you-stamp { display: flex; align-items: center; gap: 8px; border-left: 3px solid var(--gold); padding: 4px 0 4px 8px; text-shadow: 0 2px 7px #000; }
    .you-stamp img { width: 48px; height: 48px; object-fit: cover; cursor: pointer; border: 1px solid var(--gold); border-radius: 50%; }
    .you-stamp .servant-avatar { width: 36px; height: 36px; margin-left: -16px; border-color: var(--cyan); }
    .you-copy b { display: block; color: var(--gold-soft); font-size: 13px; }
    .you-copy small { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }
    .stats { display: flex; gap: 10px; margin-top: 6px; color: var(--paper); font-size: 9px; }
    .stats b { color: var(--gold); font-size: 12px; }

    .attack-hand, .skill-hand, .attack-zone, .skill-zone {
      display: flex;
      align-items: flex-end;
      gap: var(--card-gap);
      height: 248px;
      pointer-events: none;
    }
    .hand-zones { --card-w: clamp(112px, calc((100vw - 440px) / 6), 148px); --card-h: calc(var(--card-w) * 214 / 148); position: absolute; left: 220px; right: 120px; bottom: 16px; display: flex; justify-content: center; align-items: flex-end; gap: 40px; z-index: 7; }
    .attack-hand, .skill-hand { position: relative; flex: 0 0 calc(3 * var(--card-w) + 2 * var(--card-gap)); width: calc(3 * var(--card-w) + 2 * var(--card-gap)); height: calc(var(--card-h) + 34px); }
    .attack-hand { justify-content: flex-end; }
    .attack-hand .hand-label { left: auto; right: 0; }
    .hand-label {
      position: absolute;
      top: 8px;
      left: 0;
      color: var(--paper);
      font-size: 11px;
      pointer-events: none;
      text-shadow: 0 2px 7px #000;
    }
    .hand-label b { color: var(--gold-soft); }
    .hand-card {
      position: relative;
      flex: 0 0 var(--card-w);
      width: var(--card-w);
      height: var(--card-h);
      cursor: pointer;
      pointer-events: auto;
      border: 3px solid var(--paper);
      background: var(--ink);
      box-shadow: 0 18px 28px var(--shadow);
      transition: transform .17s ease, border-color .17s ease, filter .17s ease;
    }
    .hand-card:hover, .hand-card.is-selected { border-color: var(--gold-soft); filter: brightness(1.08); transform: translateY(-22px); z-index: 9; }
    .hand-card.is-played { display: none; }
    .hand-card img { display: block; width: 100%; height: 100%; object-fit: cover; }

    .attack-zone {
      position: absolute;
      left: 236px;
      bottom: 214px;
      z-index: 6;
      height: auto;
      min-height: var(--card-h);
      padding-left: 0;
    }
    .skill-zone {
      position: absolute;
      right: 10px;
      bottom: 214px;
      z-index: 6;
      height: auto;
      min-height: var(--card-h);
      padding-left: 0;
    }
    .attack-zone-meta {
      flex: 0 0 auto;
      min-width: 118px;
      margin-right: 8px;
      padding: 8px 10px;
      border-left: 3px solid var(--gold);
      background: rgba(12,13,13,.78);
      color: var(--paper);
      text-shadow: 0 2px 6px #000;
      pointer-events: none;
    }
    .attack-zone-meta small { display: block; color: var(--muted); font-size: 10px; }
    .attack-zone-meta b { display: block; margin-top: 4px; color: var(--gold-soft); font-size: 16px; }
    .played-card {
      flex: 0 0 var(--card-w);
      width: var(--card-w);
      height: var(--card-h);
      margin-left: 0;
      cursor: pointer;
      pointer-events: auto;
      overflow: hidden;
      border: 3px solid var(--gold-soft);
      background: var(--ink);
      box-shadow: 0 18px 28px var(--shadow);
    }
    .played-card + .played-card { margin-left: 0; }
    .played-card img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .played-card:hover { filter: brightness(1.08); z-index: 9; }

    .phase-control { position: absolute; right: 0; bottom: -2px; z-index: 8; display: flex; align-items: center; gap: 10px; pointer-events: auto; }
    .phase-copy { color: var(--paper); text-align: right; text-shadow: 0 2px 7px #000; }
    .phase-copy small { display: block; color: var(--muted); font-size: 9px; }
    .phase-copy b { display: block; margin-top: 3px; color: var(--paper); font-size: 15px; font-weight: 500; }
    .phase-orb { display: grid; place-items: center; width: 79px; height: 79px; cursor: pointer; border: 3px solid var(--paper); border-radius: 50%; background: var(--red); box-shadow: 0 9px 18px rgba(0,0,0,.48); text-align: center; }
    .phase-orb b { display: block; font-size: 15px; }
    .phase-orb small { display: block; margin-top: 2px; font-size: 9px; }
    .phase-orb svg { display: block; margin: 4px auto 0; width: 17px; height: 10px; fill: none; stroke: var(--paper); stroke-width: 2.5; }
    .phase-orb:hover { border-color: var(--gold-soft); transform: translateY(-3px); }

    .toast { position: fixed; top: 18px; left: 50%; z-index: 20; display: none; transform: translateX(-50%); padding: 8px 12px; border-left: 2px solid var(--gold); background: rgba(12,15,16,.92); color: var(--gold-soft); font-size: 11px; }
    .toast.is-open { display: block; }

    .side-inspect {
      position: fixed;
      right: 216px;
      top: 50%;
      z-index: 20;
      display: none;
      width: 252px;
      pointer-events: none;
      transform: translateY(-50%);
      border: 1px solid var(--gold);
      background: #090b0b;
      box-shadow: 0 18px 40px rgba(0,0,0,.7);
    }
    .side-inspect.is-open { display: block; }
    .side-inspect img { display: block; width: 252px; height: 352px; object-fit: cover; }

    .overlay { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; padding: 22px; background: rgba(5,7,7,.8); }
    .overlay.is-open { display: grid; }
    .close { position: absolute; top: 8px; right: 8px; width: 29px; height: 29px; cursor: pointer; border: 1px solid rgba(245,239,229,.32); background: var(--ink-soft); font-size: 20px; }

    .opp-panel {
      position: relative;
      width: min(960px, 94vw);
      max-height: calc(100vh - 44px);
      overflow: hidden;
      border: 1px solid var(--gold);
      background: var(--ink);
      box-shadow: 0 26px 80px rgba(0,0,0,.72);
    }
    .opp-panel-scroll {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-auto-flow: row;
      gap: 14px;
      max-height: calc(100vh - 46px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 22px 22px 18px;
    }
    .opp-panel > .close { z-index: 2; width: 44px; height: 44px; }
    .opp-player-switch { display: flex; flex-wrap: wrap; gap: 8px; padding-right: 44px; }
    .opp-player-switch button { min-height: 36px; padding: 6px 10px; border: 1px solid #7b6b42; background: #171d1e; color: var(--gold-soft); cursor: pointer; }
    .opp-player-switch button[aria-pressed="true"] { border-color: var(--gold); background: #56471f; }
    .opp-stats { display: flex; flex-wrap: wrap; gap: 18px; margin: 0; padding: 10px 12px; border-block: 1px solid #655a3b; background: #191f20; }
    .opp-stats div { display: flex; align-items: baseline; gap: 8px; }
    .opp-stats dt { color: var(--muted); font-size: 12px; }
    .opp-stats dd { margin: 0; color: var(--gold-soft); font-size: 18px; font-weight: bold; }
    .opp-ability { margin: 8px 0 0; font-size: 12px; line-height: 1.6; color: #e9e0cc; }
    .opp-power-note { color: var(--muted); font-size: 11px; margin: -6px 0 0; }
    .opp-panel h2 { margin: 0 0 4px; color: var(--gold-soft); font-size: 20px; }
    .opp-col span { display: block; margin-bottom: 6px; color: var(--muted); font-size: 11px; }
    .opp-grid { display: grid; grid-template-columns: 216px 216px minmax(120px, 1fr); gap: 24px; }
    .opp-col { min-width: 0; }
    .opp-col img { display: block; width: 100%; aspect-ratio: 63 / 88; object-fit: cover; border: 1px solid rgba(231,185,67,.4); }
    .opp-skill-row { }
    .opp-skill-row span { display: block; margin: 10px 0 6px; color: var(--muted); font-size: 11px; }
    .opp-skills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .opp-skills img { display: block; width: 100%; aspect-ratio: 63 / 88; object-fit: cover; border: 1px solid rgba(231,185,67,.4); }
    .opp-seals { position: relative; width: 216px; height: 270px; }
    .opp-seals img {
      position: absolute;
      width: 168px;
      height: 234px;
      object-fit: cover;
      border: 1px solid rgba(231,185,67,.45);
      background: #090b0b;
    }
    .opp-seals img:nth-child(1) { left: 0; top: 24px; z-index: 3; }
    .opp-seals img:nth-child(2) { left: 24px; top: 12px; z-index: 2; }
    .opp-seals img:nth-child(3) { left: 48px; top: 0; z-index: 1; }

    .opp-inspect-card {
      flex: 0 0 var(--card-w);
      width: var(--card-w);
      height: var(--card-h);
      overflow: hidden;
      cursor: pointer;
      border: 3px solid var(--gold-soft);
      background: var(--ink);
      box-shadow: 0 18px 28px var(--shadow);
    }
    .opp-inspect-card img { display: block; width: 100%; height: 100%; object-fit: cover; }

    .seal-choice {
      width: min(520px, 94vw);
      padding: 22px;
      border: 1px solid var(--gold);
      background: var(--ink);
    }
    .seal-choice h2 { margin: 0 0 8px; color: var(--gold-soft); font-size: 20px; }
    .seal-choice p { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
    .seal-choice button {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 10px 12px;
      cursor: pointer;
      border: 1px solid rgba(231,185,67,.4);
      background: var(--ink-soft);
      color: var(--paper);
      text-align: left;
    }
    .seal-choice button:hover { border-color: var(--gold-soft); color: var(--gold-soft); }
    .seal-choice button[aria-pressed="true"] { border-color: var(--gold-soft); background: rgba(231,185,67,.2); box-shadow: inset 3px 0 var(--gold-soft); }
    .seal-choice #confirm-seal-choice { margin-top: 18px; text-align: center; color: var(--ink); background: var(--gold-soft); font-weight: 800; }
    .seal-choice #confirm-seal-choice:disabled { opacity: .4; cursor: not-allowed; }
    .hand-zones .attack-zone { left: 0; bottom: calc(var(--card-h) + 60px); }
    .opp-seat.is-selected { border-color: var(--gold); background: #29261b; }
    .player-drawer { padding: 14px; background: #121718; border-left: 2px solid var(--gold); box-shadow: 0 12px 24px #0008; }
    .player-drawer[hidden] { display: none; }
    .player-drawer header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; font-size: 14px; }
    .player-drawer header button { width: 44px; height: 44px; font-size: 24px; cursor: pointer; }
    .player-drawer-cards { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
    .player-drawer-cards p { margin: 0; color: var(--muted); font-size: 14px; }
    .player-drawer .opp-inspect-card { height: var(--card-h); }
    @media (max-width: 1200px) { .hand-zones { gap: 24px; } .phase-control { flex-direction: column; align-items: flex-end; width: 100px; gap: 6px; } .phase-copy { font-size: 11px; } }
  </style>
</head>
<body>
  <div class="stage">
    <main class="map-stage" data-od-id="open-fuyuki-board">
      <div class="map-viewport" id="map-viewport">
        <div class="map-content" id="map-content">
          <img class="map-board" src="assets/fuyuki-city.webp" alt="冬木市地图" width="1927" height="1179">
          <div class="map-objects">
            <button class="map-card slot-situation" data-card="situation-turning" aria-label="局势 转机">
              <img src="assets/situation-turning-point.webp" alt="局势：转机">
            </button>
            <button class="map-card pile-events" data-card="event-deck" aria-label="事件牌堆">
              <img src="assets/event-back.webp" alt="事件牌堆">
              <span class="pile-tag">事件 6</span>
            </button>
            <button class="map-card pile-miyama" data-card="event-deck-miyama" aria-label="深山事件牌堆">
              <img src="assets/event-back.webp" alt="深山事件牌堆">
              <span class="pile-tag">深山 2</span>
            </button>
            <button class="map-card pile-shinto" data-card="event-deck-shinto" aria-label="新都事件牌堆">
              <img src="assets/event-back.webp" alt="新都事件牌堆">
              <span class="pile-tag">新都 1</span>
            </button>
            <button class="map-card event-slot event-miyama-1" data-card="event-fate-battle" aria-label="深山町事件 命运之战">
              <img src="assets/event-fate-battle.webp" alt="深山町事件：命运之战">
            </button>
            <button class="map-card event-slot event-shinto-2" data-card="event-sanctuary" aria-label="新都事件 圣地">
              <img src="assets/event-sanctuary.png" alt="新都事件：圣地">

      shinji: {

        skills: [],

        played: []

    };

    const viewport = document.querySelector('#map-viewport');
    const content = document.querySelector('#map-content');
    const oppOverlay = document.querySelector('#opp-overlay');
    const playerDrawer = document.createElement('section');
    playerDrawer.id = 'player-drawer';
    playerDrawer.className = 'player-drawer';
    playerDrawer.hidden = true;
    let selectedPlayer = null;
    const sealOverlay = document.querySelector('#seal-overlay');
    const sideInspect = document.querySelector('#side-inspect');
    const attackZone = document.querySelector('#attack-zone');
    let scale = 1, tx = 0, ty = 0, pendingSeal = null, selectedSealChoice = null, inspectId = null, inspectDismissed = false;
    const played = ['attack-strength-high'];

    const showToast = (message) => {
      const toast = document.querySelector('#toast');
      toast.textContent = message;
      toast.classList.add('is-open');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => toast.classList.remove('is-open'), 1700);
    };
    const applyView = () => {
      content.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      document.querySelector('#zoom-readout').textContent = `${Math.round(scale * 100)}%`;
    };
    const fitMap = () => {
      const rect = viewport.getBoundingClientRect();
      const inset = { top: 8, right: 10, bottom: 8, left: 8 };
      const availW = rect.width - inset.left - inset.right;
      const availH = rect.height - inset.top - inset.bottom;
      scale = Math.min(availW / (BOARD_W + PILE_GUTTER), availH / BOARD_H);
      const usedW = (BOARD_W + PILE_GUTTER) * scale;
      const usedH = BOARD_H * scale;
      tx = inset.left + (availW - usedW) / 2 + PILE_GUTTER * scale;
      ty = inset.top + (availH - usedH) / 2;
      applyView();
    };
    const showInspect = (id) => {
      const data = cards[id];
      if (!data) return;
      if (id !== inspectId) inspectDismissed = false;
      inspectId = id;
      if (inspectDismissed) return;
      document.querySelector('#side-image').src = data[0];
      document.querySelector('#side-image').alt = data[1];
      sideInspect.classList.add('is-open');
    };
    const hideInspect = () => sideInspect.classList.remove('is-open');
    const dismissInspect = () => {
      inspectDismissed = true;
      hideInspect();
    };
    const leaveInspectSource = () => {
      inspectDismissed = false;
      inspectId = null;
      hideInspect();
    };
    const bindInspect = (el, getId, onClick) => {
      el.addEventListener('pointerenter', () => showInspect(getId()));
      el.addEventListener('pointerleave', leaveInspectSource);
      el.addEventListener('click', (event) => {
        dismissInspect();
        if (onClick) onClick(event);
      });
    };
    const replaceDetailImage = (selector, src, alt) => {
      const current = document.querySelector(selector);
      if (current.getAttribute('src') === src) {
        current.alt = alt;
        return;
      }
      // A reused image can retain the previous player's decoded pixels while
      // its new source loads. A new node keeps image identity with the player.
      const next = current.cloneNode(false);
      next.src = src;
      next.alt = alt;
      current.replaceWith(next);
    };
    const renderOppSkills = (player) => {
      const box = document.querySelector('#opp-skills');
      box.innerHTML = '';
      if (player.hidden) {
        replaceDetailImage('#opp-servant-card', 'assets/back-servant-gold.png', '从者牌背面');
        for (let i = 0; i < 3; i += 1) {
          const img = document.createElement('img');
          img.src = 'assets/back-skill-red.png';
          img.alt = '技能背面';
          box.appendChild(img);
        }
        return;
      }
      replaceDetailImage('#opp-servant-card', player.servant, player.servantAlt);
      (player.skills || []).forEach(([src, alt]) => {
        const img = document.createElement('img');
        img.src = src;
        img.alt = alt;
        box.appendChild(img);
      });
    };
    const closePlayerDrawer = () => {
      playerDrawer.hidden = true;
      selectedPlayer = null;
      document.querySelectorAll('.opp-seat').forEach(seat => seat.classList.remove('is-selected'));
    };
    const selectPlayer = (id) => {
      const player = players[id];
      const seat = document.querySelector(`.opp-seat[data-player="${id}"]`);
      if (!player || !seat || oppOverlay.classList.contains('is-open')) return;
      selectedPlayer = id;
      document.querySelectorAll('.opp-seat').forEach(node => node.classList.toggle('is-selected', node === seat));
      playerDrawer.replaceChildren();
      const heading = document.createElement('header');
      const title = document.createElement('strong'); title.textContent = `${player.name} · 已打出 ${(player.played || []).length}`;
      const close = document.createElement('button'); close.type = 'button'; close.textContent = '×'; close.setAttribute('aria-label', '收起已打出'); close.addEventListener('click', closePlayerDrawer);
      heading.append(title, close); playerDrawer.append(heading);
      const cards = document.createElement('div'); cards.className = 'player-drawer-cards';
      (player.played || []).forEach(([src, alt, cardId]) => {
        const button = document.createElement('button'); button.className = 'opp-inspect-card'; button.type = 'button'; button.setAttribute('aria-label', alt);
        const img = document.createElement('img'); img.src = src; img.alt = alt; button.append(img); cards.append(button);
        bindInspect(button, () => cardId || 'attack-magic-low');
      });
      if (!cards.children.length) { const empty = document.createElement('p'); empty.textContent = '本轮尚未出牌'; cards.append(empty); }
      playerDrawer.append(cards); seat.after(playerDrawer); playerDrawer.hidden = false;
    };
    const resetSealChoice = () => {
      selectedSealChoice = null;
      document.querySelectorAll('[data-seal-choice]').forEach(button => button.setAttribute('aria-pressed', 'false'));
      document.querySelector('#confirm-seal-choice').disabled = true;
    };

      resetSealChoice();
      pendingSeal = null;
      sealOverlay.classList.remove('is-open');
    };
    const closeOpp = () => {
      oppOverlay.classList.remove('is-open');
      if (selectedPlayer) selectPlayer(selectedPlayer);
    };
    const openOpp = (id) => {
      const player = players[id];
      if (!player) return;
      hideInspect();
      document.querySelector('.opp-panel-scroll').scrollTop = 0;
      document.querySelector('#opp-title').textContent = player.name;
      replaceDetailImage('#opp-master', player.master, `${player.name}能力卡`);
      document.querySelector('#opp-ability').textContent = player.ability;
      document.querySelector('#opp-power-note').textContent = player.powerNote;
      const stats = document.querySelector('#opp-stats');
      stats.replaceChildren();
      for (const [label, value] of [['魔力', player.mana], ['令咒', player.seals], ['当前威力', player.power], ['战果', player.victory]]) {
        const row = document.createElement('div');
        const term = document.createElement('dt'); term.textContent = label;
        const amount = document.createElement('dd'); amount.textContent = String(value);
        row.append(term, amount); stats.append(row);
      }
      document.querySelectorAll('#opp-player-switch button').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.player === id)));
      renderOppSkills(player);
      const seals = document.querySelector('#opp-seals');
      seals.innerHTML = '';
      for (let i = 0; i < player.seals; i += 1) {
        const img = document.createElement('img');
        img.src = 'assets/command-seal-shirou.png';
        img.alt = '令咒';
        seals.appendChild(img);
      }
      oppOverlay.classList.add('is-open');
      playerDrawer.hidden = true;
    };
    const renderPlayed = () => {
      attackZone.querySelectorAll('.played-card').forEach((node) => node.remove());
      let power = TERRAIN_POWER;
      played.forEach((id) => {
        const source = document.querySelector(`[data-hand-card="${id}"]`);
        if (!source) return;
        power += Number(source.dataset.power || 0);
        const button = document.createElement('button');
        button.className = 'played-card';
        button.type = 'button';
        button.dataset.withdraw = id;
        button.setAttribute('aria-label', `撤回${source.querySelector('img').alt}`);
        const img = document.createElement('img');
        img.src = source.querySelector('img').src;
        img.alt = source.querySelector('img').alt;
        button.appendChild(img);
        attackZone.appendChild(button);
      });
      const n = String(played.length).padStart(2, '0');
      document.querySelector('#play-count').textContent = `出牌 ${played.length}/2`;
      document.querySelector('#total-power').textContent = `合计威力 ${power}`;
      document.querySelector('#attack-count').textContent = String(3 - played.length);
      document.querySelector('#phase-progress').textContent = `行动阶段 · 已编成 ${n} 张`;
    };
    const playAttack = (id) => {
      if (played.includes(id) || played.length >= 2) {
        showToast(played.length >= 2 ? '行动阶段只能打出 2 张攻击' : '这张已经在攻击区');
        return;
      }
      played.push(id);
      document.querySelector(`[data-hand-card="${id}"]`).classList.add('is-played');
      renderPlayed();
    };
    const withdrawAttack = (id) => {
      const index = played.indexOf(id);
      if (index < 0) return;
      played.splice(index, 1);
      document.querySelector(`[data-hand-card="${id}"]`).classList.remove('is-played');
      renderPlayed();
    };

    fitMap();
    renderPlayed();
    window.addEventListener('resize', () => {
      fitMap();
    });
    document.querySelector('#zoom-reset').addEventListener('click', fitMap);

    viewport.addEventListener('wheel', (event) => {
      event.preventDefault();
      const rect = viewport.getBoundingClientRect();
      const px = event.clientX - rect.left;
      const py = event.clientY - rect.top;
      const next = Math.min(2.4, Math.max(0.45, scale * (event.deltaY < 0 ? 1.12 : 1 / 1.12)));
      const k = next / scale;
      tx = px - (px - tx) * k;
      ty = py - (py - ty) * k;
      scale = next;
      applyView();
    }, { passive: false });

    let drag = null;
    viewport.addEventListener('dragstart', event => event.preventDefault());
    viewport.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      event.preventDefault();
      drag = { id: event.pointerId, x: event.clientX, y: event.clientY, tx, ty, moved: false, target: event.target };
      viewport.setPointerCapture(event.pointerId);
    });
    viewport.addEventListener('pointermove', (event) => {
      if (!drag || event.pointerId !== drag.id) return;
      const dx = event.clientX - drag.x;
      const dy = event.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) < 5) return;
      drag.moved = true;
      viewport.classList.add('is-panning');
      tx = drag.tx + dx;
      ty = drag.ty + dy;
      applyView();
    });
    const endDrag = (event) => {
      if (!drag || event.pointerId !== drag.id) return;
      const clicked = !drag.moved;
      const target = drag.target;
      viewport.classList.remove('is-panning');
      drag = null;
      if (clicked && target && target.closest('[data-card]')) dismissInspect();
    };
    viewport.addEventListener('pointerup', endDrag);
    viewport.addEventListener('pointercancel', endDrag);

    document.querySelectorAll('.attack-hand [data-hand-card]').forEach((card) => {
      bindInspect(card, () => card.dataset.card, () => playAttack(card.dataset.handCard));
    });
    document.querySelectorAll('.skill-hand [data-hand-card]').forEach((card) => {
      bindInspect(card, () => card.dataset.card);
    });
    document.querySelectorAll('.map-card[data-card]').forEach((card) => {
      card.addEventListener('pointerenter', () => showInspect(card.dataset.card));
      card.addEventListener('pointerleave', leaveInspectSource);
    });
    attackZone.addEventListener('click', (event) => {
      const card = event.target.closest('[data-withdraw]');
      if (!card) return;
      dismissInspect();
      withdrawAttack(card.dataset.withdraw);
    });
    attackZone.addEventListener('pointerover', (event) => {
      const card = event.target.closest('[data-withdraw]');
      if (card) showInspect(card.dataset.withdraw);
    });
    attackZone.addEventListener('pointerout', (event) => {
      if (event.target.closest('[data-withdraw]')) leaveInspectSource();
    });
    document.querySelectorAll('#you-master, #you-servant').forEach((el) => {
      bindInspect(el, () => el.dataset.hoverCard, () => openOpp('shirou'));
      el.tabIndex = 0; el.setAttribute('role', 'button');
      el.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openOpp('shirou'); } });
    });
    bindInspect(document.querySelector('#draw-pile'), () => 'draw-back');
    bindInspect(document.querySelector('#discard-pile'), () => 'attack-magic-low');

    const playerSwitch = document.querySelector('#opp-player-switch');
    Object.entries(players).forEach(([id, player]) => {
      const button = document.createElement('button'); button.type = 'button';
      button.dataset.player = id; button.textContent = player.name;
      button.setAttribute('aria-pressed', 'false');
      button.addEventListener('click', () => openOpp(id)); playerSwitch.append(button);
    });
    document.querySelectorAll('.opp-seat').forEach((seat) => {
      seat.tabIndex = 0; seat.setAttribute('role', 'button'); seat.setAttribute('aria-label', `查看${players[seat.dataset.player].name}详情`);
      seat.addEventListener('pointerenter', () => selectPlayer(seat.dataset.player));
      seat.addEventListener('focus', () => selectPlayer(seat.dataset.player));
      seat.addEventListener('click', () => openOpp(seat.dataset.player));
      seat.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openOpp(seat.dataset.player); }
      });
    });

    document.querySelectorAll('.seal').forEach((button) => {
      button.addEventListener('click', () => {
        if (button.classList.contains('is-spent')) return;
        resetSealChoice();
        pendingSeal = button;
        sealOverlay.classList.add('is-open');
      });
    });
    document.querySelectorAll('[data-seal-choice]').forEach((button) => {
      button.addEventListener('click', () => {
        if (!pendingSeal) return;
        selectedSealChoice = button.dataset.sealChoice;
        document.querySelectorAll('[data-seal-choice]').forEach(option => option.setAttribute('aria-pressed', String(option === button)));
        document.querySelector('#confirm-seal-choice').disabled = false;
      });
    });
    document.querySelector('#confirm-seal-choice').addEventListener('click', () => {
      if (!pendingSeal || !selectedSealChoice) return;
      const effect = selectedSealChoice;
      if (effect === 'mana') {
        players.shirou.mana += 4;
        document.querySelector('#own-mana').textContent = String(players.shirou.mana);
      }
      pendingSeal.classList.add('is-spent');
      const left = document.querySelectorAll('.seal:not(.is-spent)').length;
      closeSeal();
      showToast(`${effect === 'mana' ? '获得 4 魔力 · ' : ''}令咒已使用 · 剩余 ${left}`);
    });

    document.querySelector('#next').addEventListener('click', () => {
      if (played.length !== 2) {
        showToast('行动阶段须打出恰好 2 张攻击，可随时撤回调整');
        return;
      }
      document.querySelector('#phase-label').textContent = '等待响应';
      showToast('攻击已确认 · 等待对手响应');
    });
    document.querySelector('#close-opp').addEventListener('click', closeOpp);
    oppOverlay.addEventListener('click', (event) => { if (event.target === oppOverlay) closeOpp(); });
    sealOverlay.addEventListener('click', (event) => { if (event.target === sealOverlay) closeSeal(); });
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape' || event.defaultPrevented) return;
      if (sideInspect.classList.contains('is-open')) dismissInspect();
      else if (sealOverlay.classList.contains('is-open')) closeSeal();
      else if (oppOverlay.classList.contains('is-open')) closeOpp();
      else if (!playerDrawer.hidden) closePlayerDrawer();
      else return;
      event.preventDefault();
      event.stopPropagation();
    });
  </script>
</body>
</html>
