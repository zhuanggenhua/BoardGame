<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>纸牌帮 Open Design 当前 UI 基线稿 v0.4</title>
  <style>
    :root {
      --felt-a: #173e27;
      --felt-b: #10361f;
      --felt-c: #0f2f1b;
      --panel: rgba(0, 54, 40, 0.88);
      --panel-deep: rgba(0, 44, 33, 0.94);
      --panel-line: rgba(247, 221, 114, 0.42);
      --text: #fff6c4;
      --muted: rgba(255, 246, 196, 0.72);
      --gold: #f7df73;
      --gold-strong: #fdd95e;
      --disabled: rgba(119, 105, 74, 0.62);
      --shadow: rgba(0, 0, 0, 0.42);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #08150d;
    }

    body {
      display: grid;
      place-items: center;
    }

    .outer-hud {
      position: fixed;
      inset: 0;
      z-index: 20;
      width: 1920px;
      height: 1080px;
      margin: auto;
      pointer-events: none;
      color: var(--text);
    }

    .frame {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 48%, rgba(242, 222, 119, 0.06), transparent 23%),
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.026) 0 1px, transparent 1px 23px),
        linear-gradient(115deg, var(--felt-a), var(--felt-b) 58%, var(--felt-c));
    }

    .frame::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 50%, transparent 0 42%, rgba(5, 20, 12, 0.16) 74%, rgba(3, 12, 8, 0.3) 100%);
      pointer-events: none;
    }

    .players {
      position: absolute;
      z-index: 2;
      top: 66px;
      left: 366px;
      right: 366px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      align-items: start;
      text-align: center;
      font-size: 15px;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.75);
    }

    .players span:first-child {
      color: var(--gold);
    }

    .score {
      position: absolute;
      z-index: 21;
      top: 18px;
      right: 22px;
      display: flex;
      align-items: center;
      gap: 18px;
      color: #fff4c0;
      font-size: 16px;
      font-weight: 950;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
    }

    .toast {
      position: absolute;
      z-index: 22;
      top: 16px;
      right: 16px;
      display: none;
      align-items: center;
      gap: 12px;
      width: 320px;
      min-height: 54px;
      padding: 0 14px;
      border-radius: 4px;
      color: #6f674f;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.15);
      font-size: 12px;
      font-weight: 700;
      pointer-events: auto;
    }

    .toast .warn {
      display: grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border: 2px solid #dd9d32;
      border-radius: 50%;
      color: #dd9d32;
      font-size: 11px;
      font-weight: 950;
    }

    .toast .close {
      margin-left: auto;
      color: #8a7557;
      font-size: 22px;
      line-height: 1;
    }

    .table {
      position: absolute;
      z-index: 1;
      inset: 0;
    }

    .chips {
      position: absolute;
      top: 475px;
      left: 655px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .chip {
      width: 48px;
      height: 48px;
      object-fit: contain;
      filter:
        drop-shadow(0 7px 8px rgba(0, 0, 0, 0.48))
        drop-shadow(0 0 15px rgba(247, 223, 115, 0.22));
    }

    .river {
      position: absolute;
      top: 418px;
      left: 862px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .card-frame {
      width: 123px;
      height: 169px;
      padding: 5px;
      border-radius: 10px;
      border: 5px solid rgba(247, 223, 115, 0.9);
      background: rgba(247, 223, 115, 0.12);
      box-shadow:
        0 0 0 2px rgba(24, 15, 3, 0.95),
        0 6px 10px rgba(0, 0, 0, 0.4),
        0 0 25px rgba(247, 223, 115, 0.72);
    }

    .card-frame img,
    .hand-card img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 5px;
      object-fit: cover;
    }

    .hand-rank {
      position: absolute;
      left: 777px;
      bottom: 70px;
      min-width: 72px;
      min-height: 23px;
      padding: 4px 10px;
      border-radius: 999px;
      color: #fff4a1;
      background: rgba(0, 54, 40, 0.94);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.32);
    }

    .hand {
      position: absolute;
      left: 866px;
      bottom: 16px;
      display: flex;
      align-items: end;
      gap: 12px;
      padding-right: 52px;
    }

    .hand-card {
      position: relative;
      z-index: 1;
      width: 114px;
      height: 161px;
      overflow: hidden;
      border-radius: 8px;
      background: #fff;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.78),
        4px 5px 0 rgba(0, 0, 0, 0.4);
    }

    .hand-chip {
      position: absolute;
      z-index: 2;
      top: -18px;
      right: 0;
      width: 36px;
      height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.52));
    }

    .helper {
      position: absolute;
      z-index: 3;
      left: 15px;
      bottom: 70px;
      width: 322px;
    }

    .rank-panel {
      height: 154px;
      padding: 11px 8px 10px;
      border: 1px solid var(--panel-line);
      border-radius: 8px;
      color: #f8eb95;
      background: rgba(0, 47, 36, 0.91);
      box-shadow: 0 9px 22px rgba(0, 0, 0, 0.32);
      font-size: 14px;
      font-weight: 950;
    }

    .rank-head {
      display: flex;
      justify-content: space-between;
      padding: 0 1px 7px;
      color: rgba(247, 223, 115, 0.82);
      font-size: 12px;
    }

    .rank-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 24px;
      row-gap: 4px;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 24px 1fr;
      align-items: center;
      height: 18px;
      padding: 0 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.045);
    }

    .rank-row:nth-child(n+6) {
      background: transparent;
    }

    .rank-row strong {
      color: #f8d45c;
      font-weight: 950;
    }

    .tools {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      margin-top: 7px;
    }

    .tool {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 50px;
      border-radius: 6px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: #fff4b8;
      background: rgba(0, 48, 39, 0.95);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
      font-size: 15px;
      font-weight: 950;
      letter-spacing: 0.03em;
    }

    .tool.active {
      width: 93px;
      color: #15381e;
      background: linear-gradient(180deg, #fff08a, #f0d34d);
    }

    .tool.mid {
      width: 93px;
    }

    .tool.wide {
      width: 121px;
    }

    .tool .count {
      margin-left: 3px;
      padding: 2px 5px;
      border-radius: 3px;
      color: #fffbd1;
      background: rgba(0, 0, 0, 0.24);
      font-size: 10px;
    }

    .action {
      position: absolute;
      z-index: 3;
      top: 804px;
      right: 112px;
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .next {
      width: 132px;
      height: 56px;
      border: 0;
      border-radius: 999px;
      color: rgba(255, 246, 211, 0.56);
      background: rgba(118, 101, 68, 0.72);
      font-size: 18px;
      font-weight: 950;
      letter-spacing: 0.03em;
      box-shadow: 0 9px 24px rgba(0, 0, 0, 0.32);
    }

    .round-entry {
      display: grid;
      place-items: center;
      width: 49px;
      height: 49px;
      border-radius: 999px;
      color: #fff;
      background: #020604;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.42);
      font-size: 27px;
      font-weight: 300;
    }

    .baseline-note {
      position: absolute;
      z-index: 0;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <section class="outer-hud" aria-label="应用外层 HUD">
    <section class="score" aria-label="外层抢劫进度">
      <span>抢劫 1</span>
      <span>金库 0/3</span>
      <span>警报 0/3</span>
    </section>

    <section class="toast" aria-label="外层当前提示">
      <span class="warn">!</span>
      <span>房主开始抢劫后才能拿筹码。</span>
      <span class="close">×</span>
    </section>
  </section>

  <main class="frame" aria-label="纸牌帮当前 UI 基线稿 v0.4">
    <p class="baseline-note">
      当前稿以真实纸牌帮运行态截图为基线：开放绿毡布、顶部稀疏玩家名、中央筹码与公共牌、左下辅助入口、底部手牌、右侧可点主操作，右上为外层 HUD。
    </p>

    <section class="players" aria-label="玩家">
      <span>玩家 2</span>
      <span>玩家 3</span>
    </section>

    <section class="table" aria-label="牌桌">
      <div class="chips" aria-label="可选筹码">
        <img class="chip" src="assets/round-1-white-1.webp" alt="白筹码 1">
        <img class="chip" src="assets/round-1-white-2.webp" alt="白筹码 2">
        <img class="chip" src="assets/round-1-white-3.webp" alt="白筹码 3">
      </div>

      <div class="river" aria-label="公共牌">
        <div class="card-frame"><img src="assets/five-spades.webp" alt="黑桃 5"></div>
        <div class="card-frame"><img src="assets/card-back.webp" alt="背面牌"></div>
        <div class="card-frame"><img src="assets/five-hearts.webp" alt="红桃 5"></div>
      </div>

      <div class="hand-rank">手牌：一对</div>
      <div class="hand" aria-label="我的手牌">
        <div class="hand-card"><img src="assets/four-clubs.webp" alt="梅花 4"></div>
        <div class="hand-card"><img src="assets/six-clubs.webp" alt="梅花 6"></div>
        <img class="hand-chip" src="assets/round-1-white-1.webp" alt="已选白筹码 1">
      </div>
    </section>

    <section class="helper" aria-label="左下辅助入口">
      <div class="rank-panel" aria-label="牌型速查">
        <div class="rank-head"><span>弱</span><span>强</span></div>
        <div class="rank-grid">
          <div class="rank-row"><strong>1</strong><span>高牌</span></div>
          <div class="rank-row"><strong>2</strong><span>一对</span></div>
          <div class="rank-row"><strong>3</strong><span>两对</span></div>
          <div class="rank-row"><strong>4</strong><span>三条</span></div>
          <div class="rank-row"><strong>5</strong><span>顺子</span></div>
          <div class="rank-row"><strong>6</strong><span>同花</span></div>
          <div class="rank-row"><strong>7</strong><span>葫芦</span></div>
          <div class="rank-row"><strong>8</strong><span>四条</span></div>
          <div class="rank-row"><strong>9</strong><span>同花顺</span></div>
          <div class="rank-row"><strong>10</strong><span>皇家同花顺</span></div>
        </div>
      </div>
      <div class="tools" aria-label="工具入口">
        <div class="tool active">☷ 牌型</div>
        <div class="tool mid">☷ 扩展</div>
        <div class="tool wide">⌘ 工具 <span class="count">0/0</span></div>
      </div>
    </section>

    <section class="action" aria-label="主操作">
      <button class="next" type="button">下一轮</button>
      <div class="round-entry" aria-label="更多入口">↪</div>
    </section>
  </main>
</body>
</html>
