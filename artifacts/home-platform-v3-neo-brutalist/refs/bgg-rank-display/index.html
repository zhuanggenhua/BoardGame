<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="5" />
  <title>bgg · rank · display</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    body { margin: 0; background: #111827; color: #e5e7eb; }
    header { position: sticky; top: 0; z-index: 1; padding: 16px 20px; background: #1f2937; border-bottom: 1px solid #374151; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p { margin: 0; color: #9ca3af; font-size: 13px; }
    main { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); padding: 20px; }
    figure { margin: 0; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 12px; }
    img { display: block; width: 100%; height: auto; border-radius: 8px; background: #030712; }
    figcaption { padding-top: 10px; }
    strong { display: block; font-size: 15px; }
    span { display: block; margin-top: 4px; color: #9ca3af; font-size: 13px; line-height: 1.5; }
    .empty { padding: 24px; color: #fca5a5; }
  </style>
</head>
<body>
  <header>
    <h1>bgg · rank · display</h1>
    <p>这个文件固定在截图目录内；刷新页面会读取该目录当前文件。</p>
  </header>
  <main id="gallery"></main>
  <script>
    const items = [{"relativePath":"01-rank-list.png","displayTitle":"01 · rank · list","description":"只有游戏有 Rank。Geek Rating 是用来排名的分数，Average 是平均分，彩色格是玩家给这款游戏的评分","kind":"image"},{"relativePath":"02-how-ranked.png","displayTitle":"02 · how · ranked","description":"Top Ranked / Most Rated / Most Played 全是游戏榜，没有玩家排行","kind":"image"},{"relativePath":"03-rating-a-game.png","displayTitle":"03 · rating · a · game","description":"大数字和 Avg. Rating 属于这款游戏。My rating 是玩家给游戏打的分。Overall Rank 是游戏位次","kind":"image"},{"relativePath":"04-game-stats.png","displayTitle":"04 · game · stats","description":"Stats 仍是游戏统计：平均分、评分数、Overall Rank。不是玩家主页字段","kind":"image"},{"relativePath":"05-user-profile.jpg","displayTitle":"05 · user · profile","description":"用户资料是身份和徽章，没有玩家排行，也没有当前正在游戏","kind":"image"}];
    const gallery = document.querySelector("#gallery");
    const cacheBust = Date.now();
    if (items.length === 0) {
      gallery.innerHTML = '<div class="empty">当前目录还没有截图。</div>';
    } else {
      for (const item of items) {
        const figure = document.createElement("figure");
        const image = document.createElement("img");
        image.alt = item.displayTitle;
        image.src = "./" + encodeURIComponent(item.relativePath) + "?updated=" + cacheBust;
        const caption = document.createElement("figcaption");
        const label = document.createElement("strong");
        label.textContent = item.displayTitle;
        caption.append(label);
        if (item.description) {
          const description = document.createElement("span");
          description.textContent = item.description;
          caption.append(description);
        }
        figure.append(image, caption);
        gallery.append(figure);
      }
    }
  </script>
</body>
</html>
