<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="5" />
  <title>exports</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    body { margin: 0; background: #111827; color: #e5e7eb; }
    header { position: sticky; top: 0; z-index: 1; padding: 16px 20px; background: #1f2937; border-bottom: 1px solid #374151; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p { margin: 0; color: #9ca3af; font-size: 13px; }
    main { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); padding: 20px; }
    figure { margin: 0; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 12px; }
    img { display: block; width: 100%; height: auto; border-radius: 8px; background: #030712; }
    figcaption { padding-top: 10px; }
    strong { display: block; font-size: 15px; }
    span { display: block; margin-top: 4px; color: #9ca3af; font-size: 13px; line-height: 1.5; }
    .empty { padding: 24px; color: #fca5a5; }
  </style>
</head>
<body>
  <header>
    <h1>exports</h1>
    <p>这个文件固定在截图目录内；刷新页面会读取该目录当前文件。</p>
  </header>
  <main id="gallery"></main>
  <script>
    const items = [{"relativePath":"01-收藏库主页.png","displayTitle":"01 · 收藏库主页","description":"新情报速递是横版四卡，游戏名版本和更新说明叠在图内","kind":"image"},{"relativePath":"01b-收藏库悬停.png","displayTitle":"01b · 收藏库悬停","description":"封面抬起，半透介绍铺满竖图，玩法说明清楚可读","kind":"image"},{"relativePath":"02-收藏库游戏页.png","displayTitle":"02 · 收藏库游戏页","description":"封面四键同一排且有空隙，配置表是小图标加文字，房间标题没有这些按钮","kind":"image"},{"relativePath":"02b-收藏库排行榜.png","displayTitle":"02b · 收藏库排行榜","description":"排行榜封面四键仍同一排且有空隙，房间好友占满右侧","kind":"image"},{"relativePath":"02c-收藏库规则概览.png","displayTitle":"02c · 收藏库规则概览","description":"规则概览是原文，封面四键同一排且有空隙，对局条压在规则文字上","kind":"image"},{"relativePath":"03-切发现再回收藏库.png","displayTitle":"03 · 切发现再回收藏库","description":"切回收藏库后封面四键仍同一排有空隙，右侧两框贴底","kind":"image"},{"relativePath":"04-点主页.png","displayTitle":"04 · 点主页","description":"右侧回到横版新情报和我的游戏竖封面墙","kind":"image"},{"relativePath":"05-发现网格.png","displayTitle":"05 · 发现网格","description":"发现页六列竖长方形封面，游戏名叠在封面内部","kind":"image"},{"relativePath":"05b-发现悬停.png","displayTitle":"05b · 发现悬停","description":"发现页悬停时封面内叠出大段介绍","kind":"image"},{"relativePath":"06-游戏详情.png","displayTitle":"06 · 游戏详情","description":"详情四键同一排且有空隙，电子化作者单独一行，房间行按钮不贴死","kind":"image"},{"relativePath":"06b-作者弹窗.png","displayTitle":"06b · 作者弹窗","description":"作者弹窗右上角正方形叉，没有取消文字","kind":"image"},{"relativePath":"06c-销毁确认.png","displayTitle":"06c · 销毁确认","description":"销毁确认右上角叉号，底部居中销毁，没有取消文字","kind":"image"},{"relativePath":"06d-创建房间.png","displayTitle":"06d · 创建房间","description":"创建房间右上角叉号，底部居中创建，电脑选项点击展开","kind":"image"},{"relativePath":"07-上传页.png","displayTitle":"07 · 上传页","description":"游戏链接下方绿色写可以打开，人数两个下拉中间写至","kind":"image"},{"relativePath":"07b-上传新游戏.png","displayTitle":"07b · 上传新游戏","description":"空游戏链接下方灰色写粘贴后自动检测能否打开","kind":"image"},{"relativePath":"08-个人主页.png","displayTitle":"08 · 个人主页","description":"左右资料背景中间内容井，动态行写游戏排行和三位小数分数，侧栏没有排行没有评分","kind":"image"},{"relativePath":"m01-收藏库主页.png","displayTitle":"m01 · 收藏库主页","description":"顶栏只留品牌和头像，底栏三导航，封面两列，列表不占主栏","kind":"image"},{"relativePath":"m02-收藏库游戏页.png","displayTitle":"m02 · 收藏库游戏页","description":"四键纵向有空隙，当前房间在封面下且露在对局条上方","kind":"image"},{"relativePath":"m02b-游戏列表抽屉.png","displayTitle":"m02b · 游戏列表抽屉","description":"左侧抽屉打开可见大杀四方等游戏名","kind":"image"},{"relativePath":"m05-发现两列.png","displayTitle":"m05 · 发现两列","description":"发现页两列竖封面，游戏名叠在图内","kind":"image"},{"relativePath":"m05b-发现点开展开.png","displayTitle":"m05b · 发现点开展开","description":"封面上展开介绍，还没有打开全屏详情","kind":"image"},{"relativePath":"m06-游戏详情.png","displayTitle":"m06 · 游戏详情","description":"详情几乎铺满屏幕，右上角正方形叉","kind":"image"},{"relativePath":"m06c-销毁确认.png","displayTitle":"m06c · 销毁确认","description":"确认框左右留白，右上叉，底部居中销毁","kind":"image"},{"relativePath":"m06d-创建房间.png","displayTitle":"m06d · 创建房间","description":"创建框左右留白，右上叉，底部居中创建","kind":"image"},{"relativePath":"m07-上传页.png","displayTitle":"m07 · 上传页","description":"单列表单，分类下是人数两个下拉，链接下有自动检测","kind":"image"},{"relativePath":"m08-个人主页.png","displayTitle":"m08 · 个人主页","description":"身份统计动态纵向叠放，动态行排行和分数露在对局条上方","kind":"image"},{"relativePath":"m08b-顶栏抽屉.png","displayTitle":"m08b · 顶栏抽屉","description":"抽屉里有搜索、操作指南和中文，底栏仍在","kind":"image"}];
    const gallery = document.querySelector("#gallery");
    const cacheBust = Date.now();
    if (items.length === 0) {
      gallery.innerHTML = '<div class="empty">当前目录还没有截图。</div>';
    } else {
      for (const item of items) {
        const figure = document.createElement("figure");
        const image = document.createElement("img");
        image.alt = item.displayTitle;
        image.src = "./" + encodeURIComponent(item.relativePath) + "?updated=" + cacheBust;
        const caption = document.createElement("figcaption");
        const label = document.createElement("strong");
        label.textContent = item.displayTitle;
        caption.append(label);
        if (item.description) {
          const description = document.createElement("span");
          description.textContent = item.description;
          caption.append(description);
        }
        figure.append(image, caption);
        gallery.append(figure);
      }
    }
  </script>
</body>
</html>
